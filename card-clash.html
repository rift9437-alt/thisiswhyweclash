<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keep Clash</title>
<style>
  :root{
    --bg-deep:#0e1a13;
    --bg-mid:#16281c;
    --lane:#274a30;
    --river:#2b5f7a;
    --gold:#e8b84b;
    --gold-dim:#8a6a22;
    --blue:#4a8fd6;
    --red:#d65a4a;
    --parchment:#f2e6c8;
    --ink:#1c1408;
    --r-common:#8fa3ad;
    --r-rare:#f2a33d;
    --r-epic:#b455e0;
    --r-legendary:#4fd6d6;
    --r-broken:#ff3d7a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg-deep);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    color:var(--parchment);
    overflow:hidden;
    user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    padding:8px;
  }
  #hud{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2px 6px 6px;
    font-size:13px;
    letter-spacing:.3px;
  }
  #timer{font-size:18px;font-weight:bold;color:var(--gold);text-shadow:0 1px 2px #000;}
  #status{opacity:.85;}
  #trophyBadge{
    display:flex;align-items:center;gap:4px;font-size:12px;font-weight:bold;color:var(--gold);
    text-shadow:0 1px 2px #000;
  }
  #boardWrap{
    position:relative;
    width:100%;
    max-width:480px;
    flex:1;
    min-height:0;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 0 3px #3a2b12, 0 0 0 6px var(--gold-dim), 0 8px 24px rgba(0,0,0,.6);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:var(--bg-mid);
    touch-action:none;
  }
  #elixirBar{
    width:100%;
    max-width:480px;
    height:20px;
    background:#241633;
    border-radius:10px;
    margin:8px 0 6px;
    position:relative;
    box-shadow:inset 0 0 0 2px #4b2f6e;
    overflow:hidden;
  }
  #elixirFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#b455e0,#7b2fd6);
    transition:width .15s linear;
  }
  #elixirLabel{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:bold;
    text-shadow:0 1px 2px #000;
  }
  #hand{
    width:100%;
    max-width:480px;
    display:flex;
    gap:6px;
    justify-content:center;
    padding-bottom:6px;
  }
  .card{
    position:relative;
    width:70px;
    height:92px;
    border-radius:8px;
    background:linear-gradient(160deg,#3a2b58,#241633);
    box-shadow:0 0 0 2px var(--r-common), 0 3px 6px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6px 4px 4px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card[data-rarity="rare"]{box-shadow:0 0 0 2px var(--r-rare), 0 3px 6px rgba(0,0,0,.5);}
  .card[data-rarity="epic"]{box-shadow:0 0 0 2px var(--r-epic), 0 3px 8px rgba(180,85,224,.4);}
  .card[data-rarity="legendary"]{box-shadow:0 0 0 2px var(--r-legendary), 0 3px 10px rgba(79,214,214,.5);}
  .card[data-rarity="broken"]{
    box-shadow:0 0 0 2px var(--r-broken), 0 0 14px rgba(255,61,122,.7);
    animation:brokenPulse 1.4s ease-in-out infinite;
  }
  @keyframes brokenPulse{
    0%,100%{box-shadow:0 0 0 2px var(--r-broken), 0 0 10px rgba(255,61,122,.6);}
    50%{box-shadow:0 0 0 2px #fff, 0 0 20px rgba(255,61,122,.95);}
  }
  .card.selected{
    transform:translateY(-10px);
    box-shadow:0 0 0 2px var(--gold), 0 6px 14px rgba(0,0,0,.6);
  }
  .card.disabled{
    filter:grayscale(.7) brightness(.6);
    cursor:not-allowed;
  }
  .card .icon{width:44px;height:44px;margin-bottom:2px;}
  .card .name{font-size:9px;text-align:center;line-height:1.1;font-weight:bold;}
  .card .cost{
    position:absolute;
    top:-6px;left:-6px;
    width:20px;height:20px;
    border-radius:50%;
    background:#7b2fd6;
    box-shadow:0 0 0 2px #b455e0;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;
  }
  #overlay{
    position:absolute;inset:0;
    background:rgba(6,10,7,.85);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:20;
  }
  #overlay h1{
    font-size:32px;
    margin:0 0 6px;
    color:var(--gold);
    text-shadow:0 2px 4px #000;
  }
  #overlay p{margin:2px 0 16px;opacity:.85;}
  #overlay button{
    font-family:inherit;
    font-size:15px;
    padding:10px 22px;
    border-radius:8px;
    border:none;
    background:linear-gradient(160deg,#f2d27a,#c9962e);
    color:#3a2708;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #7a5714;
  }
  #overlay button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5714;}
  #lobby{
    position:absolute;inset:0;
    background:rgba(6,10,7,.92);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;
    z-index:30;gap:10px;padding:20px;
  }
  #lobby h1{color:var(--gold);margin:0 0 10px;text-shadow:0 2px 4px #000;}
  #lobbyMode{display:flex;flex-direction:column;gap:8px;width:220px;}
  #lobby button{
    font-family:inherit;font-size:14px;padding:10px 14px;border-radius:8px;
    border:none;background:linear-gradient(160deg,#f2d27a,#c9962e);
    color:#3a2708;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #7a5714;
  }
  #lobby button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5714;}
  #lobbyJoinForm{display:flex;gap:6px;}
  #joinCodeInput{
    font-family:inherit;font-size:16px;text-transform:uppercase;letter-spacing:2px;
    width:100px;padding:9px;border-radius:6px;border:2px solid var(--gold-dim);
    text-align:center;background:#241633;color:#fff;
  }
  #lobbyStatus{font-size:13px;opacity:.85;min-height:18px;}
  #nameInput{
    font-family:inherit;font-size:15px;padding:9px 12px;border-radius:6px;
    border:2px solid var(--gold-dim);background:#241633;color:#fff;
    text-align:center;width:220px;margin-bottom:4px;
  }
  #lobbyBottomRow{display:flex;gap:8px;margin-top:4px;}
  #lobbyBottomRow button{
    font-size:12px;padding:7px 12px;background:linear-gradient(160deg,#8a6fd6,#5a3ea0);
    color:#fff;box-shadow:0 3px 0 #3a2270;border:none;border-radius:7px;font-family:inherit;cursor:pointer;
  }
  #collection{
    position:absolute;inset:0;background:rgba(6,10,7,.96);z-index:40;
    display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto;
  }
  #collection h2{color:var(--gold);margin:4px 0 12px;}
  #collectionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;}
  .ccard{
    background:linear-gradient(160deg,#3a2b58,#241633);border-radius:8px;
    box-shadow:0 0 0 2px var(--r-common);padding:8px 4px;display:flex;flex-direction:column;
    align-items:center;position:relative;
  }
  .ccard[data-rarity="rare"]{box-shadow:0 0 0 2px var(--r-rare);}
  .ccard[data-rarity="epic"]{box-shadow:0 0 0 2px var(--r-epic);}
  .ccard[data-rarity="legendary"]{box-shadow:0 0 0 2px var(--r-legendary);}
  .ccard[data-rarity="broken"]{box-shadow:0 0 0 2px var(--r-broken), 0 0 10px rgba(255,61,122,.6);}
  .ccard.locked{filter:grayscale(.85) brightness(.5);}
  .ccard canvas{width:52px;height:52px;}
  .ccard .cname{font-size:10px;font-weight:bold;text-align:center;margin-top:2px;}
  .ccard .creq{font-size:9px;opacity:.75;margin-top:2px;}
  .ccard .lockicon{
    position:absolute;top:4px;right:4px;font-size:11px;opacity:.85;
  }
  #trophyRow{color:var(--gold);font-size:13px;margin-bottom:6px;font-weight:bold;}
  #collectionClose{
    margin-top:16px;font-family:inherit;font-size:14px;padding:9px 18px;border-radius:8px;
    border:none;background:linear-gradient(160deg,#f2d27a,#c9962e);color:#3a2708;font-weight:bold;cursor:pointer;
  }
  #unlockToast{
    position:absolute;top:40px;left:50%;transform:translateX(-50%);
    background:linear-gradient(160deg,#f2d27a,#c9962e);color:#3a2708;
    padding:10px 16px;border-radius:8px;font-size:13px;font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.5);z-index:50;display:none;text-align:center;
  }
  #roomCodeBanner{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.55);padding:3px 10px;border-radius:6px;
    font-size:12px;letter-spacing:1px;z-index:15;display:none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="status">Deploy troops · defend your towers</div>
    <div id="trophyBadge">🏆 <span id="trophyCount">0</span></div>
    <div id="timer">2:00</div>
  </div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="roomCodeBanner"></div>
    <div id="unlockToast"></div>
    <div id="collection">
      <h2>Your Collection</h2>
      <div id="trophyRow">🏆 <span id="collTrophies">0</span> trophies — win battles to unlock new cards</div>
      <div id="collectionGrid"></div>
      <button id="collectionClose">Close</button>
    </div>
    <div id="lobby">
      <h1>Keep Clash</h1>
      <input id="nameInput" maxlength="16" placeholder="Your name">
      <div id="lobbyMode">
        <button id="btnHost">Host Online Match</button>
        <button id="btnJoin">Join with Code</button>
        <button id="btnAI">Practice vs AI</button>
      </div>
      <div id="lobbyJoinForm" style="display:none">
        <input id="joinCodeInput" maxlength="5" placeholder="CODE" autocomplete="off">
        <button id="btnJoinGo">Connect</button>
      </div>
      <div id="lobbyBottomRow">
        <button id="btnCollection">View Collection</button>
      </div>
      <div id="lobbyStatus"></div>
    </div>
    <div id="overlay">
      <h1 id="overTitle">Victory!</h1>
      <p id="overSub">You destroyed more towers.</p>
      <button id="playAgain">Play Again</button>
    </div>
  </div>
  <div id="elixirBar"><div id="elixirFill"></div><div id="elixirLabel">4.0 / 10</div></div>
  <div id="hand"></div>
</div>

<script>
(function(){
"use strict";

// ---------- Multiplayer config ----------
// Deploy /server (server.js + package.json) as a Web Service on Render, then paste
// the host it gives you here, e.g. "card-clash-abcd.onrender.com" (no https://, no trailing slash).
const SERVER_HOST = "card-clash-server.onrender.com";

let ONLINE = false;      // are we in an online match?
let MY_ROLE = 'p1';      // 'p1' or 'p2' - which side we control
let socket = null;
let waitingForOpponent = false;

function vy(y){ return MY_ROLE === 'p2' ? (H - y) : y; }         // canonical -> screen y
function invVy(y){ return MY_ROLE === 'p2' ? (H - y) : y; }      // screen -> canonical y (same formula, it's a reflection)

function randomRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function connectToRoom(code, isHost){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${proto}://${SERVER_HOST}/room/${code.toLowerCase()}`);
  document.getElementById('lobbyStatus').textContent = 'Connecting...';
  const wakeupNotice = setTimeout(()=>{
    if(document.getElementById('lobbyStatus').textContent === 'Connecting...'){
      document.getElementById('lobbyStatus').textContent = 'Still connecting… free server may be waking up (~30s)';
    }
  }, 4000);

  socket.addEventListener('open', ()=>{
    clearTimeout(wakeupNotice);
    document.getElementById('lobbyStatus').textContent = isHost
      ? `Share this code: ${code}` : 'Connected. Waiting for host...';
  });

  socket.addEventListener('message', (evt)=>{
    const msg = JSON.parse(evt.data);
    if(msg.type === 'assign'){
      MY_ROLE = msg.role;
    } else if(msg.type === 'start'){
      startOnlineMatch(code);
    } else if(msg.type === 'play'){
      spawnCard(msg.owner, msg.card, msg.x, msg.y);
    } else if(msg.type === 'full'){
      document.getElementById('lobbyStatus').textContent = 'That room is full.';
    } else if(msg.type === 'opponent_left'){
      document.getElementById('lobbyStatus').textContent = 'Opponent disconnected.';
      if(state) endGame(MY_ROLE); // you win by default
    }
  });

  socket.addEventListener('close', ()=>{
    if(state && state.running) document.getElementById('status').textContent = 'Connection lost';
  });
}

function startOnlineMatch(code){
  ONLINE = true;
  document.getElementById('lobby').style.display = 'none';
  const banner = document.getElementById('roomCodeBanner');
  banner.style.display = 'block';
  banner.textContent = `Room ${code.toUpperCase()} · You are ${MY_ROLE.toUpperCase()}`;
  newGame();
}

function sendPlay(owner, cardKey, x, y){
  if(!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({type:'play', owner, card: cardKey, x, y}));
}

// ---------- Canvas / board setup ----------
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const boardWrap = document.getElementById('boardWrap');
const W = 360, H = 520; // logical resolution
canvas.width = W; canvas.height = H;

function resize(){
  const rect = boardWrap.getBoundingClientRect();
  canvas.style.height = rect.height + 'px';
  canvas.style.width = rect.width + 'px';
}
window.addEventListener('resize', resize);
resize();

// Lanes: left lane x-range, right lane x-range, river band
const LANE_L = {x1: 30, x2: 140};
const LANE_R = {x1: 220, x2: 330};
const RIVER_Y1 = 245, RIVER_Y2 = 275;
const BRIDGE_L = {x1: 30, x2: 140};
const BRIDGE_R = {x1: 220, x2: 330};

// Tower positions
function towers(){
  return {
    p1King:  {x:180, y:495, r:26, hp:2400, maxHp:2400, side:'p1', type:'king', alive:true, active:false},
    p1Left:  {x:85,  y:440, r:20, hp:1400, maxHp:1400, side:'p1', type:'princess', alive:true, active:true, lane:'L'},
    p1Right: {x:275, y:440, r:20, hp:1400, maxHp:1400, side:'p1', type:'princess', alive:true, active:true, lane:'R'},
    p2King:  {x:180, y:25,  r:26, hp:2400, maxHp:2400, side:'p2', type:'king', alive:true, active:false},
    p2Left:  {x:85,  y:80,  r:20, hp:1400, maxHp:1400, side:'p2', type:'princess', alive:true, active:true, lane:'L'},
    p2Right: {x:275, y:80,  r:20, hp:1400, maxHp:1400, side:'p2', type:'princess', alive:true, active:true, lane:'R'},
  };
}

// ---------- Card definitions ----------
// rarity drives visual border + is purely cosmetic; unlock = trophies required before the
// card enters the player's rotation (AI always has access to the full non-broken roster).
const CARD_DB = {
  // --- starters (unlocked from trophy 0) ---
  knight:    {name:'Knight',    cost:3, model:'knight',    hp:210, dmg:24, range:16, speed:22, atkSpeed:0.9,  splash:false, ranged:false, targets:'ground', rarity:'common', unlock:0},
  archer:    {name:'Archers',   cost:3, model:'archer',    hp:68,  dmg:18, range:80, speed:20, atkSpeed:0.85, splash:false, ranged:true,  targets:'both',   rarity:'common', unlock:0, twin:true},
  goblins:   {name:'Goblins',   cost:2, model:'goblin',    hp:48,  dmg:19, range:14, speed:30, atkSpeed:0.6,  splash:false, ranged:false, targets:'ground', rarity:'common', unlock:0, swarm:3},
  skeletons: {name:'Skeletons', cost:1, model:'skeleton',  hp:20,  dmg:10, range:12, speed:26, atkSpeed:0.5,  splash:false, ranged:false, targets:'ground', rarity:'common', unlock:0, swarm:4},
  fireball:  {name:'Fireball',  cost:4, model:'fireball',  spell:true, dmg:280, radius:55, rarity:'rare', unlock:0},

  // --- 100 trophies ---
  minipekka: {name:'Mini P.K.', cost:4, model:'minipekka', hp:230, dmg:68, range:14, speed:26, atkSpeed:1.3,  splash:false, ranged:false, targets:'ground', rarity:'rare', unlock:100},
  cannon:    {name:'Cannon',    cost:3, model:'cannon',    hp:300, dmg:50, range:75, speed:0,  atkSpeed:0.9,  splash:false, ranged:true,  targets:'ground', rarity:'common', unlock:100, building:true},

  // --- 200 trophies ---
  giant:     {name:'Giant',     cost:5, model:'giant',     hp:600, dmg:32, range:16, speed:14, atkSpeed:1.4,  splash:false, ranged:false, targets:'buildings', rarity:'rare', unlock:200},
  musketeer: {name:'Musketeer', cost:4, model:'musketeer', hp:155, dmg:50, range:90, speed:20, atkSpeed:1.1,  splash:false, ranged:true,  targets:'both', rarity:'rare', unlock:200},

  // --- 350 trophies ---
  wizard:    {name:'Wizard',    cost:5, model:'wizard',    hp:130, dmg:38, range:75, speed:18, atkSpeed:1.1,  splash:true, splashR:36, ranged:true, targets:'both', rarity:'epic', unlock:350},
  valkyrie:  {name:'Valkyrie',  cost:4, model:'valkyrie',  hp:310, dmg:38, range:16, speed:18, atkSpeed:1.1,  splash:true, splashR:30, ranged:false, targets:'ground', rarity:'rare', unlock:350},

  // --- 500 trophies ---
  hogrider:  {name:'Hog Rider', cost:4, model:'hogrider',  hp:270, dmg:46, range:14, speed:40, atkSpeed:1.1,  splash:false, ranged:false, targets:'buildings', rarity:'epic', unlock:500},
  babydragon:{name:'Baby Dragon',cost:4, model:'babydragon',hp:145, dmg:34, range:55, speed:20, atkSpeed:1.1, splash:true, splashR:28, ranged:true, targets:'both', rarity:'epic', unlock:500, flying:true},

  // --- 700 trophies ---
  prince:    {name:'Prince',    cost:5, model:'prince',    hp:360, dmg:62, range:16, speed:24, atkSpeed:1.2,  splash:false, ranged:false, targets:'ground', rarity:'epic', unlock:700},
  skarmy:    {name:'Skel. Army',cost:3, model:'skeleton',  hp:16,  dmg:8,  range:12, speed:26, atkSpeed:0.5,  splash:false, ranged:false, targets:'ground', rarity:'epic', unlock:700, swarm:8},

  // --- 1000 trophies: the joke-broken card ---
  doomduck:  {name:'Doom Duck', cost:2, model:'doomduck',  hp:500, dmg:150, range:60, speed:38, atkSpeed:0.35, splash:true, splashR:40, ranged:true, targets:'both', rarity:'broken', unlock:1000},
};

// AI always fights with the full "fair" roster (everything except the joke-broken card,
// unless the player has already unlocked it — then it's fair game for both sides).
const FULL_DECK = Object.keys(CARD_DB).filter(k=>k!=='doomduck');
const STARTER_DECK = Object.keys(CARD_DB).filter(k=>CARD_DB[k].unlock===0);

// ---------- Progression / unlock system ----------
const SAVE_KEY = 'keepClashProgress_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(typeof p.trophies==='number') return p;
    }
  }catch(e){}
  return {trophies:0};
}
function saveProgress(p){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();

function unlockedCards(){
  return Object.keys(CARD_DB).filter(k=> CARD_DB[k].unlock <= PROGRESS.trophies);
}
function playerDeckPool(){
  const pool = unlockedCards();
  return pool.length ? pool : STARTER_DECK.slice();
}

function awardTrophies(amount){
  const before = PROGRESS.trophies;
  const beforeUnlocked = new Set(unlockedCards());
  PROGRESS.trophies = Math.max(0, PROGRESS.trophies + amount);
  saveProgress(PROGRESS);
  updateTrophyDisplays();
  const afterUnlocked = unlockedCards();
  const newlyUnlocked = afterUnlocked.filter(k=>!beforeUnlocked.has(k));
  if(newlyUnlocked.length){
    const names = newlyUnlocked.map(k=>CARD_DB[k].name).join(', ');
    showUnlockToast(`🔓 New card unlocked: ${names}!`);
  }
}

function updateTrophyDisplays(){
  const a = document.getElementById('trophyCount');
  const b = document.getElementById('collTrophies');
  if(a) a.textContent = PROGRESS.trophies;
  if(b) b.textContent = PROGRESS.trophies;
}

let unlockToastTimer = null;
function showUnlockToast(msg){
  const el = document.getElementById('unlockToast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(unlockToastTimer);
  unlockToastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3200);
}

function renderCollection(){
  updateTrophyDisplays();
  const grid = document.getElementById('collectionGrid');
  grid.innerHTML = '';
  const order = Object.keys(CARD_DB).sort((a,b)=>CARD_DB[a].unlock - CARD_DB[b].unlock);
  for(const key of order){
    const def = CARD_DB[key];
    const locked = def.unlock > PROGRESS.trophies;
    const div = document.createElement('div');
    div.className = 'ccard' + (locked ? ' locked' : '');
    div.dataset.rarity = def.rarity || 'common';
    div.innerHTML = `
      ${locked ? '<div class="lockicon">🔒</div>' : ''}
      <canvas width="88" height="88"></canvas>
      <div class="cname">${def.name}</div>
      <div class="creq">${locked ? `🏆 ${def.unlock} to unlock` : (def.rarity||'common').toUpperCase()}</div>
    `;
    grid.appendChild(div);
    const mini = div.querySelector('canvas');
    const mctx = mini.getContext('2d');
    drawModelOn(mctx, def.model, 44, 60, 2.2, '#7fb8ef', 'p1');
  }
}

// ---------- Game state ----------
let state = null;
function freshState(){
  const myPool = shuffled(playerDeckPool().slice());
  const myHand = myPool.splice(0,4);
  const enemyPool = shuffled(FULL_DECK.slice());
  return {
    time: 120, // seconds
    running: true,
    over: false,
    towers: towers(),
    units: [],   // {id,owner,card,x,y,hp,maxHp,target,cooldown,...}
    spellFx: [],
    elixir: {p1: 5, p2: 5},
    hand: {p1: myHand, p2: null},
    deckQueue: {p1: myPool, p2: enemyPool},
    nextId: 1,
    aiTimer: 1.2,
    selectedCard: null,
  };
}
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newGame(){
  state = freshState();
  document.getElementById('overlay').style.display = 'none';
  renderHand();
  updateElixirBar();
  updateTimer();
}

// ---------- Deployment zones ----------
// Player (p1) can only deploy in bottom half (y between river and own king), enemy top half is AI-only.
function inDeployZone(owner, x, y){
  if(owner === 'p1'){
    return y > RIVER_Y2 + 4 && y < 500 && x > 15 && x < W-15;
  } else {
    return y < RIVER_Y1 - 4 && y > 20 && x > 15 && x < W-15;
  }
}

// ---------- Spawning ----------
function laneOf(x){
  return x < W/2 ? 'L' : 'R';
}

function spawnCard(owner, cardKey, x, y){
  const def = CARD_DB[cardKey];
  if(def.spell){
    castSpell(owner, def, x, y);
    return;
  }
  const count = def.swarm || (def.twin ? 2 : 1);
  for(let i=0;i<count;i++){
    let ox = x + (i - (count-1)/2) * 16;
    ox = Math.max(20, Math.min(W-20, ox));
    state.units.push({
      id: state.nextId++,
      owner, card: cardKey, def,
      x: ox, y: y,
      hp: def.hp, maxHp: def.hp,
      target: null, cooldown: 0,
      lane: laneOf(ox),
      slowUntil: 0,
    });
  }
}

function castSpell(owner, def, x, y){
  state.spellFx.push({x, y, r: def.radius, t: 0, dur: 0.5});
  // damage towers
  for(const key in state.towers){
    const t = state.towers[key];
    if(!t.alive) continue;
    const d = Math.hypot(t.x-x, t.y-y);
    if(d < def.radius + t.r){
      applyDamage(t, def.dmg, owner);
    }
  }
  for(const u of state.units){
    if(u.owner === owner) continue;
    const d = Math.hypot(u.x-x, u.y-y);
    if(d < def.radius){
      u.hp -= def.dmg;
    }
  }
  state.units = state.units.filter(u=>u.hp>0);
}

function applyDamage(tower, dmg, attackerOwner){
  tower.hp -= dmg;
  if(tower.hp <= 0 && tower.alive){
    tower.alive = false;
    tower.hp = 0;
    // if a princess tower dies, king tower of that side becomes active (auto-attacks)
    if(tower.type === 'princess'){
      const kingKey = tower.side === 'p1' ? 'p1King' : 'p2King';
      state.towers[kingKey].active = true;
    }
    checkGameOver();
  }
}

function checkGameOver(){
  if(!state.towers.p1King.alive){ endGame('p2'); }
  if(!state.towers.p2King.alive){ endGame('p1'); }
}

function endGame(winnerSideOrTie){
  if(state.over) return;
  state.over = true;
  state.running = false;
  // trophies only matter for solo/practice progression, not online matches
  if(!ONLINE){
    if(winnerSideOrTie === 'p1') awardTrophies(30 + countAliveTowers('p1')*5);
    else if(winnerSideOrTie === 'p2') awardTrophies(-10);
    else awardTrophies(5);
  }
  showOverlay(winnerSideOrTie);
}

function countAliveTowers(side){
  let c = 0;
  for(const k in state.towers){
    const t = state.towers[k];
    if(t.side===side && t.type==='princess' && t.alive) c++;
  }
  return c;
}

function showOverlay(winner){
  const ov = document.getElementById('overlay');
  const title = document.getElementById('overTitle');
  const sub = document.getElementById('overSub');
  if(winner === 'tie'){
    title.textContent = "It's a Draw!";
    sub.textContent = 'Equal towers remaining.';
  } else if(winner === 'p1'){
    title.textContent = 'Victory!';
    sub.textContent = 'You crushed the enemy king!';
  } else {
    title.textContent = 'Defeat';
    sub.textContent = 'Your king has fallen. Try again!';
  }
  ov.style.display = 'flex';
}

// ---------- Combat / AI update ----------
function findTarget(unit){
  const enemyOwner = unit.owner === 'p1' ? 'p2' : 'p1';
  let best = null, bestD = Infinity;
  // enemy units in range-ish (units always can be targeted by ground/both, not buildings-only)
  if(unit.def.targets !== 'buildings'){
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(u.def.flying && !unit.def.ranged) continue; // ground melee can't hit flyers
      const d = Math.hypot(u.x-unit.x, u.y-unit.y);
      if(d < bestD){ bestD = d; best = {type:'unit', ref:u, d}; }
    }
  }
  // towers
  for(const k in state.towers){
    const t = state.towers[k];
    if(t.side !== enemyOwner || !t.alive) continue;
    const d = Math.hypot(t.x-unit.x, t.y-unit.y);
    if(d < bestD){ bestD = d; best = {type:'tower', ref:t, d}; }
  }
  return best;
}

function stepUnit(u, dt){
  if(u.hp<=0) return;
  const tgt = findTarget(u);
  if(!tgt){ return; }
  const range = u.def.range + (tgt.type==='tower'? tgt.ref.r : 8);
  if(tgt.d <= range){
    // attack
    u.cooldown -= dt;
    if(u.cooldown <= 0){
      u.cooldown = u.def.atkSpeed;
      if(tgt.type==='unit'){
        if(u.def.splash){
          for(const o of state.units){
            if(o.owner===tgt.ref.owner && Math.hypot(o.x-tgt.ref.x,o.y-tgt.ref.y) < u.def.splashR){
              o.hp -= u.def.dmg;
            }
          }
        } else {
          tgt.ref.hp -= u.def.dmg;
        }
      } else {
        applyDamage(tgt.ref, u.def.dmg, u.owner);
      }
    }
  } else if(!u.def.building){
    // move toward target, but respect lane/bridge crossing
    moveToward(u, tgt);
  }
}

function moveToward(u, tgt){
  const dir = u.owner === 'p1' ? -1 : 1; // p1 moves up (negative y), p2 moves down
  let destX = tgt.ref.x, destY = tgt.ref.y;
  let mx = destX, my = destY;

  // flying units fly straight over the river, ignoring the bridge funnel
  const crossedRiver = u.def.flying ? true : (u.owner==='p1' ? u.y < RIVER_Y1 : u.y > RIVER_Y2);
  if(!crossedRiver){
    const bridge = u.lane==='L' ? BRIDGE_L : BRIDGE_R;
    const bx = (bridge.x1+bridge.x2)/2;
    // aim just PAST the river band (not inside it) so crossedRiver actually flips true
    const by = u.owner==='p1' ? (RIVER_Y1 - 10) : (RIVER_Y2 + 10);
    mx = bx; my = by;
  }

  const dx = mx - u.x, dy = my - u.y;
  const dist = Math.hypot(dx,dy) || 1;
  const spd = u.def.speed * (u.slowUntil>state.time?0.5:1);
  const step = spd * (1/60);
  if(dist < step){ u.x = mx; u.y = my; }
  else {
    u.x += dx/dist*step;
    u.y += dy/dist*step;
  }
  // clamp inside board and out of river if not crossed
  u.x = Math.max(18, Math.min(W-18, u.x));
}

// ---------- AI ----------
function aiEnsureHand(){
  if(!state.hand.p2) state.hand.p2 = state.deckQueue.p2.splice(0,4);
}
function aiPlayCard(){
  aiEnsureHand();
  const hand = state.hand.p2;
  // pick cheapest affordable card, prefer troop over spell unless can snipe low hp tower
  const affordable = hand.filter(c => CARD_DB[c].cost <= state.elixir.p2);
  if(affordable.length===0) return;
  const pick = affordable[Math.floor(Math.random()*affordable.length)];
  const lane = Math.random()<0.5 ? 'L' : 'R';
  const laneX = lane==='L' ? (LANE_L.x1+LANE_L.x2)/2 : (LANE_R.x1+LANE_R.x2)/2;
  const y = 60 + Math.random()*20;
  state.elixir.p2 -= CARD_DB[pick].cost;
  spawnCard('p2', pick, laneX, y);
  const idx = hand.indexOf(pick);
  hand.splice(idx,1);
  if(state.deckQueue.p2.length===0) state.deckQueue.p2 = shuffled(FULL_DECK.slice());
  hand.push(state.deckQueue.p2.shift());
}

// ---------- Main loop ----------
let lastTs = null;
function loop(ts){
  if(lastTs===null) lastTs = ts;
  let dt = (ts - lastTs)/1000;
  dt = Math.min(dt, 0.05);
  lastTs = ts;

  if(state.running && !state.over){
    update(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  state.time -= dt;
  if(state.time <= 0){
    state.time = 0;
    // decide winner by tower count
    const p1t = countAliveTowers('p1'), p2t = countAliveTowers('p2');
    if(p1t>p2t) endGame('p2'); // p2 destroyed more p1 towers -> p2... wait invert
    else if(p2t>p1t) endGame('p1');
    else endGame('tie');
    updateTimer();
    return;
  }
  updateTimer();

  // elixir regen 1 per 2.8s (approx double speed after minute mark like real game - keep simple)
  const regenRate = state.time < 60 ? (1/1.4) : (1/2.8);
  state.elixir.p1 = Math.min(10, state.elixir.p1 + regenRate*dt);
  state.elixir.p2 = Math.min(10, state.elixir.p2 + regenRate*dt);
  updateElixirBar();

  // AI logic (offline practice mode only)
  if(!ONLINE){
    state.aiTimer -= dt;
    if(state.aiTimer <= 0){
      state.aiTimer = 1.0 + Math.random()*1.5;
      if(Math.random() < 0.7) aiPlayCard();
    }
  }

  // update units
  for(const u of state.units) stepUnit(u, dt);
  state.units = state.units.filter(u=>u.hp>0);

  // tower auto-attack (princess towers + active king towers attack units in range)
  for(const k in state.towers){
    const t = state.towers[k];
    if(!t.alive) continue;
    if(t.type==='princess' || t.active){
      t.cooldown = (t.cooldown||0) - dt;
      const enemyOwner = t.side==='p1' ? 'p2' : 'p1';
      let best=null,bestD=Infinity;
      for(const u of state.units){
        if(u.owner!==enemyOwner) continue;
        const d = Math.hypot(u.x-t.x,u.y-t.y);
        if(d < 100 && d<bestD){ bestD=d; best=u; }
      }
      if(best && t.cooldown<=0){
        t.cooldown = 0.8;
        best.hp -= (t.type==='king'?50:35);
      }
    }
  }
  state.units = state.units.filter(u=>u.hp>0);

  // spell fx decay
  for(const fx of state.spellFx) fx.t += dt;
  state.spellFx = state.spellFx.filter(fx=>fx.t<fx.dur);

  checkGameOver();
}

// ---------- Rendering ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  // background lanes
  ctx.fillStyle = '#1c3322';
  ctx.fillRect(0,0,W,H);

  // side grass strips
  ctx.fillStyle = '#213b28';
  ctx.fillRect(0,0,15,H);
  ctx.fillRect(W-15,0,15,H);
  ctx.fillRect(140,0,80,H); // middle strip between lanes

  // lanes
  ctx.fillStyle = '#2c4f36';
  ctx.fillRect(LANE_L.x1,0,LANE_L.x2-LANE_L.x1,H);
  ctx.fillRect(LANE_R.x1,0,LANE_R.x2-LANE_R.x1,H);

  // river
  ctx.fillStyle = 'rgba(60,140,190,0.55)';
  ctx.fillRect(0,RIVER_Y1,W,RIVER_Y2-RIVER_Y1);
  // bridges
  ctx.fillStyle = '#7a5a36';
  ctx.fillRect(LANE_L.x1,RIVER_Y1-4,LANE_L.x2-LANE_L.x1,RIVER_Y2-RIVER_Y1+8);
  ctx.fillRect(LANE_R.x1,RIVER_Y1-4,LANE_R.x2-LANE_R.x1,RIVER_Y2-RIVER_Y1+8);

  // deploy zone highlight when a card selected
  if(state.selectedCard){
    ctx.fillStyle = 'rgba(232,184,75,0.12)';
    ctx.fillRect(15, RIVER_Y2+4, W-30, 500-(RIVER_Y2+4));
  }

  // towers
  for(const k in state.towers){
    drawTower(state.towers[k]);
  }

  // units
  for(const u of state.units) drawUnit(u);

  // spell fx
  for(const fx of state.spellFx){
    const p = fx.t/fx.dur;
    ctx.beginPath();
    ctx.arc(fx.x, vy(fx.y), fx.r*(0.6+0.4*p), 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,120,40,${0.5*(1-p)})`;
    ctx.fill();
  }

  if(state.over || state.time<=0){
    // handled by overlay
  }
}

function drawTower(t){
  const ty = vy(t.y);
  if(!t.alive){
    ctx.beginPath();
    ctx.arc(t.x,ty,t.r*0.7,0,Math.PI*2);
    ctx.fillStyle = 'rgba(60,50,40,0.6)';
    ctx.fill();
    return;
  }
  const isKing = t.type==='king';
  ctx.beginPath();
  ctx.arc(t.x,ty,t.r,0,Math.PI*2);
  const col = t.side==='p1' ? '#4a8fd6' : '#d65a4a';
  ctx.fillStyle = isKing ? shade(col,-15) : col;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.stroke();
  if(isKing){
    ctx.fillStyle='#f2e6c8';
    ctx.font='bold 16px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('♔', t.x, ty+1);
  }
  // hp bar
  drawHpBar(t.x, ty - t.r - 8, t.r*2, t.hp, t.maxHp, t.side==='p1'?'#4a8fd6':'#d65a4a');
}

function drawUnit(u){
  const col = u.owner==='p1' ? '#5aa8ec' : '#ec6a5a';
  const uy = vy(u.y);
  const bob = Math.sin((u.x+u.y)*0.15 + performance.now()/220) * 1.2;
  drawModel(ctx, u.def.model, u.x, uy + bob, 1, col, u.owner);
  drawHpBar(u.x, uy-20, 22, u.hp, u.maxHp, col);
}

// ---------- Vector "models" (canvas-drawn, no emoji/text glyphs) ----------
function drawModelOn(targetCtx, type, x, y, scale, col, owner){
  drawModel(targetCtx, type, x, y, scale, col, owner);
}
function drawModel(c, type, x, y, scale, col, owner){
  c.save();
  c.translate(x, y);
  c.scale(scale, scale);
  const facing = owner==='p1' ? -1 : 1; // p1 faces up-board, p2 faces down
  const dark = shade(col, -60);
  const light = shade(col, 40);
  const skin = '#e8c39a';
  const steel = '#c9d2da';
  const steelDark = '#8a94a0';

  // soft ground shadow
  c.beginPath();
  c.ellipse(0, 11, 9, 3, 0, 0, Math.PI*2);
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.fill();

  switch(type){
    case 'knight': {
      // legs
      c.fillStyle = dark;
      c.fillRect(-4,2,3,8);
      c.fillRect(1,2,3,8);
      // body/armor
      c.beginPath();
      c.moveTo(-6,2); c.lineTo(6,2); c.lineTo(5,-8); c.lineTo(-5,-8); c.closePath();
      c.fillStyle = col;
      c.fill();
      c.strokeStyle = dark; c.lineWidth=1; c.stroke();
      // shield
      c.beginPath();
      c.ellipse(facing*6, -1, 3, 5, 0, 0, Math.PI*2);
      c.fillStyle = steel; c.fill(); c.strokeStyle=steelDark; c.stroke();
      // sword
      c.strokeStyle = steel; c.lineWidth=2;
      c.beginPath(); c.moveTo(-facing*6,-9); c.lineTo(-facing*6,-16); c.stroke();
      c.fillStyle = '#d9b64a'; c.fillRect(-facing*6-2,-9,4,2);
      // helmet
      c.beginPath(); c.arc(0,-11,5,0,Math.PI*2); c.fillStyle=steel; c.fill(); c.strokeStyle=steelDark; c.stroke();
      c.fillStyle = dark; c.fillRect(-2,-13,4,2); // visor slit
      // plume
      c.fillStyle = '#d65a4a';
      c.beginPath(); c.moveTo(0,-16); c.lineTo(3,-21); c.lineTo(-1,-18); c.closePath(); c.fill();
      break;
    }
    case 'archer': {
      c.fillStyle = dark; c.fillRect(-3,2,2.5,8); c.fillRect(0.5,2,2.5,8);
      c.beginPath();
      c.moveTo(-5,2); c.lineTo(5,2); c.lineTo(4,-7); c.lineTo(-4,-7); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.stroke();
      // cloak
      c.fillStyle = shade(col,-25);
      c.beginPath(); c.moveTo(-5,-6); c.lineTo(-8,4); c.lineTo(-3,2); c.closePath(); c.fill();
      // bow
      c.strokeStyle = '#8a5a2e'; c.lineWidth=1.5;
      c.beginPath(); c.arc(facing*6,-3,7,-Math.PI/2.3,Math.PI/2.3); c.stroke();
      c.strokeStyle='#e8e0c8'; c.lineWidth=0.6;
      c.beginPath(); c.moveTo(facing*6,-9.5); c.lineTo(facing*6,3.5); c.stroke();
      // head + hood
      c.beginPath(); c.arc(0,-10,4.5,0,Math.PI*2); c.fillStyle=skin; c.fill();
      c.beginPath(); c.arc(0,-11,5,Math.PI,0); c.fillStyle=shade(col,-25); c.fill();
      break;
    }
    case 'giant': {
      c.fillStyle = dark; c.fillRect(-6,4,5,9); c.fillRect(2,4,5,9);
      c.beginPath();
      c.moveTo(-10,4); c.lineTo(10,4); c.lineTo(8,-12); c.lineTo(-8,-12); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.lineWidth=1.5; c.stroke();
      // belt
      c.fillStyle = '#5a3d1e'; c.fillRect(-9,2,18,2.5);
      // arms
      c.fillStyle = light;
      c.beginPath(); c.ellipse(-11,-2,4,7,0.3,0,Math.PI*2); c.fill();
      c.beginPath(); c.ellipse(11,-2,4,7,-0.3,0,Math.PI*2); c.fill();
      c.fillStyle = skin;
      c.beginPath(); c.arc(-12,4,3.5,0,Math.PI*2); c.fill();
      c.beginPath(); c.arc(12,4,3.5,0,Math.PI*2); c.fill();
      // head
      c.beginPath(); c.arc(0,-16,6,0,Math.PI*2); c.fillStyle=skin; c.fill();
      c.fillStyle = '#5a3d1e';
      c.beginPath(); c.arc(0,-19,6.5,Math.PI,0); c.fill(); // hair
      break;
    }
    case 'goblin': {
      c.fillStyle = '#3f7a3a'; c.fillRect(-3,1,2.5,7); c.fillRect(0.5,1,2.5,7);
      c.beginPath();
      c.moveTo(-4,1); c.lineTo(4,1); c.lineTo(3,-5); c.lineTo(-3,-5); c.closePath();
      c.fillStyle = '#4a8f42'; c.fill();
      c.beginPath(); c.arc(0,-8,4,0,Math.PI*2); c.fillStyle='#5cab52'; c.fill();
      c.fillStyle='#c93a3a';
      c.beginPath(); c.moveTo(-2,-6); c.lineTo(0,-4); c.lineTo(2,-6); c.closePath(); c.fill(); // ears/nose accent
      // dagger
      c.strokeStyle = steel; c.lineWidth=1.6;
      c.beginPath(); c.moveTo(facing*4,-3); c.lineTo(facing*9,-6); c.stroke();
      break;
    }
    case 'wizard': {
      c.fillStyle = dark; c.fillRect(-4,3,8,6);
      c.beginPath();
      c.moveTo(-6,3); c.lineTo(6,3); c.lineTo(0,-9); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.stroke();
      // hat
      c.beginPath(); c.moveTo(-5,-9); c.lineTo(5,-9); c.lineTo(0,-22); c.closePath();
      c.fillStyle = shade(col,-30); c.fill();
      c.fillStyle = '#d9b64a';
      c.beginPath(); c.arc(0,-9,5.5,0,Math.PI*2); c.fill();
      // face
      c.beginPath(); c.arc(0,-9,3.5,0,Math.PI*2); c.fillStyle=skin; c.fill();
      // staff glow hand
      c.fillStyle = '#ffd782';
      c.beginPath(); c.arc(facing*7,-2,2.6,0,Math.PI*2); c.fill();
      c.strokeStyle='rgba(255,215,130,0.6)'; c.lineWidth=4;
      c.beginPath(); c.arc(facing*7,-2,5,0,Math.PI*2); c.stroke();
      break;
    }
    case 'minipekka': {
      c.fillStyle = '#3a3a3f'; c.fillRect(-4,2,3.5,8); c.fillRect(0.5,2,3.5,8);
      c.beginPath();
      c.moveTo(-6,2); c.lineTo(6,2); c.lineTo(5,-8); c.lineTo(-5,-8); c.closePath();
      c.fillStyle = '#4a4a52'; c.fill(); c.strokeStyle='#222'; c.lineWidth=1; c.stroke();
      // huge armor helmet (pekka style)
      c.beginPath(); c.moveTo(-6,-8); c.lineTo(6,-8); c.lineTo(4,-17); c.lineTo(-4,-17); c.closePath();
      c.fillStyle = '#5a5a64'; c.fill(); c.strokeStyle='#222'; c.stroke();
      c.fillStyle = '#d65a4a';
      c.fillRect(-3,-14,2,2); c.fillRect(1,-14,2,2); // glowing eye slits
      // giant cleaver
      c.fillStyle = steel;
      c.save(); c.translate(facing*7,-4); c.rotate(facing*0.5);
      c.fillRect(-2,-12,4,16);
      c.strokeStyle = steelDark; c.strokeRect(-2,-12,4,16);
      c.restore();
      break;
    }
    case 'skeleton': {
      c.strokeStyle = '#e8e6df'; c.lineWidth=2; c.lineCap='round';
      c.beginPath(); c.moveTo(-2,2); c.lineTo(-3,10); c.moveTo(2,2); c.lineTo(3,10); c.stroke();
      c.beginPath(); c.moveTo(0,-4); c.lineTo(0,2); c.stroke();
      c.beginPath(); c.moveTo(-4,-1); c.lineTo(4,-1); c.stroke(); // arms
      c.fillStyle = '#f2f0e6';
      c.beginPath(); c.arc(0,-8,4,0,Math.PI*2); c.fill();
      c.fillStyle = '#20211f';
      c.beginPath(); c.arc(-1.5,-8.5,0.9,0,Math.PI*2); c.fill();
      c.beginPath(); c.arc(1.5,-8.5,0.9,0,Math.PI*2); c.fill();
      c.fillRect(-1,-6.5,2,1);
      break;
    }
    case 'fireball': {
      const grd = c.createRadialGradient(0,-6,1,0,-6,10);
      grd.addColorStop(0,'#fff3c4'); grd.addColorStop(0.5,'#f5a623'); grd.addColorStop(1,'#c9421a');
      c.beginPath(); c.arc(0,-6,9,0,Math.PI*2); c.fillStyle=grd; c.fill();
      break;
    }
    case 'musketeer': {
      c.fillStyle = dark; c.fillRect(-3,2,2.5,8); c.fillRect(0.5,2,2.5,8);
      c.beginPath();
      c.moveTo(-5,2); c.lineTo(5,2); c.lineTo(4,-8); c.lineTo(-4,-8); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.stroke();
      // musket
      c.strokeStyle = '#6a4a2e'; c.lineWidth=2.4;
      c.beginPath(); c.moveTo(-facing*2,-4); c.lineTo(facing*12,-6); c.stroke();
      c.strokeStyle = steel; c.lineWidth=1.2;
      c.beginPath(); c.moveTo(facing*8,-5.6); c.lineTo(facing*13,-6.3); c.stroke();
      // head + hat
      c.beginPath(); c.arc(0,-11,4.3,0,Math.PI*2); c.fillStyle=skin; c.fill();
      c.fillStyle = shade(col,-25);
      c.beginPath(); c.ellipse(0,-14,5.5,2.4,0,0,Math.PI*2); c.fill();
      break;
    }
    case 'valkyrie': {
      c.fillStyle = dark; c.fillRect(-4,2,3.5,8); c.fillRect(0.5,2,3.5,8);
      c.beginPath();
      c.moveTo(-7,2); c.lineTo(7,2); c.lineTo(5,-8); c.lineTo(-5,-8); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.lineWidth=1; c.stroke();
      // spinning axe
      c.strokeStyle = '#8a5a2e'; c.lineWidth=1.6;
      c.beginPath(); c.moveTo(-facing*10,4); c.lineTo(facing*10,-8); c.stroke();
      c.fillStyle = steel;
      c.beginPath(); c.moveTo(facing*7,-11); c.lineTo(facing*14,-7); c.lineTo(facing*7,-4); c.closePath(); c.fill();
      c.strokeStyle = steelDark; c.stroke();
      // head + red hair
      c.beginPath(); c.arc(0,-11,4.5,0,Math.PI*2); c.fillStyle=skin; c.fill();
      c.fillStyle = '#d6432e';
      c.beginPath(); c.arc(0,-13,5,Math.PI,0); c.fill();
      c.fillRect(-6,-13,2.5,10); c.fillRect(3.5,-13,2.5,10);
      break;
    }
    case 'cannon': {
      c.fillStyle = '#5a3d1e';
      c.beginPath(); c.moveTo(-11,6); c.lineTo(11,6); c.lineTo(9,-4); c.lineTo(-9,-4); c.closePath(); c.fill();
      c.strokeStyle = '#2e2010'; c.stroke();
      c.fillStyle = '#3a3a3f';
      c.beginPath(); c.ellipse(0,-6,8,5,0,0,Math.PI*2); c.fill();
      c.fillStyle = '#222226';
      c.save(); c.rotate(-facing*0.15);
      c.fillRect(-4,-16,8,12);
      c.restore();
      c.fillStyle='#111'; c.beginPath(); c.arc(0,-14,3,0,Math.PI*2); c.fill();
      break;
    }
    case 'hogrider': {
      // boar body
      c.fillStyle = '#7a5a3a';
      c.beginPath(); c.ellipse(facing*-1,4,10,6,0,0,Math.PI*2); c.fill();
      c.fillStyle = dark;
      c.fillRect(-7,7,3,5); c.fillRect(3,7,3,5);
      c.fillStyle = '#7a5a3a';
      c.beginPath(); c.ellipse(facing*8,1,5,4,0,0,Math.PI*2); c.fill();
      c.fillStyle = '#e8e0c8';
      c.beginPath(); c.moveTo(facing*11,2); c.lineTo(facing*15,0); c.lineTo(facing*11,-1); c.closePath(); c.fill();
      // rider
      c.fillStyle = col;
      c.beginPath(); c.ellipse(0,-4,5,6,0,0,Math.PI*2); c.fill(); c.strokeStyle=dark; c.stroke();
      c.beginPath(); c.arc(0,-11,4,0,Math.PI*2); c.fillStyle=skin; c.fill();
      // hammer
      c.strokeStyle = '#6a4a2e'; c.lineWidth=2;
      c.beginPath(); c.moveTo(facing*4,-6); c.lineTo(facing*12,-14); c.stroke();
      c.fillStyle = steel; c.fillRect(facing*10-3,-18,7,6);
      break;
    }
    case 'babydragon': {
      // wings
      c.fillStyle = shade(col,-15);
      c.beginPath(); c.moveTo(-4,-4); c.lineTo(-16,-10); c.lineTo(-6,2); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(4,-4); c.lineTo(16,-10); c.lineTo(6,2); c.closePath(); c.fill();
      // body
      c.beginPath(); c.ellipse(0,0,7,6,0,0,Math.PI*2); c.fillStyle=col; c.fill(); c.strokeStyle=dark; c.stroke();
      // head
      c.beginPath(); c.ellipse(facing*8,-5,4.5,3.5,0,0,Math.PI*2); c.fillStyle=col; c.fill();
      c.fillStyle = '#ffd23f';
      c.beginPath(); c.arc(facing*10,-6,1.2,0,Math.PI*2); c.fill();
      c.fillStyle = dark;
      c.beginPath(); c.moveTo(facing*6,-9); c.lineTo(facing*8,-13); c.lineTo(facing*9,-9); c.closePath(); c.fill();
      // tail
      c.strokeStyle = col; c.lineWidth=3; c.lineCap='round';
      c.beginPath(); c.moveTo(-facing*6,3); c.quadraticCurveTo(-facing*12,6,-facing*10,10); c.stroke();
      break;
    }
    case 'prince': {
      // horse
      c.fillStyle = '#8a6a3a';
      c.beginPath(); c.ellipse(0,4,11,6,0,0,Math.PI*2); c.fill();
      c.fillStyle = dark; c.fillRect(-8,7,3,5); c.fillRect(5,7,3,5);
      c.fillStyle = '#8a6a3a';
      c.beginPath(); c.ellipse(facing*9,-1,4.5,4,0,0,Math.PI*2); c.fill();
      c.fillStyle = '#3a2a18';
      c.beginPath(); c.moveTo(facing*7,-4); c.lineTo(facing*10,-9); c.lineTo(facing*8,-3); c.closePath(); c.fill();
      // rider
      c.fillStyle = col;
      c.beginPath(); c.ellipse(0,-5,5.5,6.5,0,0,Math.PI*2); c.fill(); c.strokeStyle=dark; c.stroke();
      c.beginPath(); c.arc(0,-13,4.2,0,Math.PI*2); c.fillStyle=steel; c.fill(); c.strokeStyle=steelDark; c.stroke();
      c.fillStyle = '#d65a4a';
      c.beginPath(); c.moveTo(0,-18); c.lineTo(3,-23); c.lineTo(-1,-20); c.closePath(); c.fill();
      // lance
      c.strokeStyle = steel; c.lineWidth=2.2;
      c.beginPath(); c.moveTo(-facing*3,-8); c.lineTo(facing*18,-12); c.stroke();
      c.fillStyle = '#d9b64a';
      c.beginPath(); c.arc(facing*18,-12,2,0,Math.PI*2); c.fill();
      break;
    }
    case 'doomduck': {
      // absurd golden rainbow-ish rubber duck of doom
      const t = performance.now()/160;
      const hue = (t*40)%360;
      c.fillStyle = `hsl(${hue},85%,60%)`;
      c.beginPath(); c.ellipse(0,2,10,8,0,0,Math.PI*2); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth=1; c.stroke();
      c.beginPath(); c.ellipse(facing*7,-6,6,5,0,0,Math.PI*2); c.fillStyle=`hsl(${(hue+40)%360},85%,62%)`; c.fill();
      c.fillStyle = '#ff8a1e';
      c.beginPath(); c.moveTo(facing*11,-6); c.lineTo(facing*17,-4); c.lineTo(facing*11,-2); c.closePath(); c.fill();
      c.fillStyle = '#1c1408';
      c.beginPath(); c.arc(facing*9,-8,1.3,0,Math.PI*2); c.fill();
      // tiny crown because why not
      c.fillStyle = '#ffe98a';
      c.beginPath();
      c.moveTo(facing*3,-13); c.lineTo(facing*5,-18); c.lineTo(facing*7,-13);
      c.lineTo(facing*9,-18); c.lineTo(facing*11,-13); c.closePath(); c.fill();
      break;
    }
    default: {
      c.beginPath(); c.arc(0,-4,7,0,Math.PI*2); c.fillStyle=col; c.fill();
    }
  }
  c.restore();
}

function drawHpBar(cx, y, width, hp, maxHp, col){
  const w = Math.max(width,16);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(cx-w/2, y-3, w, 5);
  ctx.fillStyle = col;
  ctx.fillRect(cx-w/2, y-3, w*Math.max(0,hp/maxHp), 5);
}

function shade(hex, pct){
  const num = parseInt(hex.slice(1),16);
  let r=(num>>16)+pct, g=((num>>8)&0xff)+pct, b=(num&0xff)+pct;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

// ---------- UI: hand & input ----------
function renderHand(){
  const handEl = document.getElementById('hand');
  handEl.innerHTML = '';
  state.hand[MY_ROLE].forEach((cardKey, idx)=>{
    const def = CARD_DB[cardKey];
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.idx = idx;
    div.dataset.rarity = def.rarity || 'common';
    div.innerHTML = `<div class="cost">${def.cost}</div><canvas class="icon" width="88" height="88"></canvas><div class="name">${def.name}</div>`;
    div.addEventListener('click', ()=> selectCard(idx));
    handEl.appendChild(div);
    const mini = div.querySelector('canvas');
    const mctx = mini.getContext('2d');
    drawModelOn(mctx, def.model, 44, 60, 2.2, '#7fb8ef', 'p1');
  });
  refreshCardStates();
}

function refreshCardStates(){
  const cards = document.querySelectorAll('.card');
  cards.forEach(c=>{
    const idx = +c.dataset.idx;
    const key = state.hand[MY_ROLE][idx];
    const def = CARD_DB[key];
    c.classList.toggle('disabled', def.cost > state.elixir[MY_ROLE] + 1e-6);
    c.classList.toggle('selected', state.selectedCard === idx);
  });
}

function selectCard(idx){
  if(state.over) return;
  const key = state.hand[MY_ROLE][idx];
  const def = CARD_DB[key];
  if(def.cost > state.elixir[MY_ROLE]) return;
  state.selectedCard = (state.selectedCard === idx) ? null : idx;
  refreshCardStates();
}

function boardCoordsFromEvent(evt){
  const rect = canvas.getBoundingClientRect();
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  const x = (clientX - rect.left) / rect.width * W;
  const yScreen = (clientY - rect.top) / rect.height * H;
  return {x, y: invVy(yScreen)}; // convert to canonical coords
}

function handleBoardTap(evt){
  if(state.selectedCard===null || state.over) return;
  const {x,y} = boardCoordsFromEvent(evt);
  const key = state.hand[MY_ROLE][state.selectedCard];
  const def = CARD_DB[key];
  if(!def.spell && !inDeployZone(MY_ROLE, x, y)) return;
  if(def.cost > state.elixir[MY_ROLE]) return;

  const px = Math.max(20,Math.min(W-20,x));
  state.elixir[MY_ROLE] -= def.cost;
  spawnCard(MY_ROLE, key, px, y);
  if(ONLINE) sendPlay(MY_ROLE, key, px, y);

  const idx = state.selectedCard;
  state.hand[MY_ROLE].splice(idx,1);
  if(state.deckQueue[MY_ROLE].length===0) state.deckQueue[MY_ROLE] = shuffled(playerDeckPool().slice());
  state.hand[MY_ROLE].push(state.deckQueue[MY_ROLE].shift());
  state.selectedCard = null;
  renderHand();
  updateElixirBar();
}

canvas.addEventListener('click', handleBoardTap);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleBoardTap(e); }, {passive:false});

// ---------- HUD updates ----------
function updateElixirBar(){
  const pct = (state.elixir[MY_ROLE]/10)*100;
  document.getElementById('elixirFill').style.width = pct+'%';
  document.getElementById('elixirLabel').textContent = state.elixir[MY_ROLE].toFixed(1)+' / 10';
  refreshCardStates();
}
function updateTimer(){
  const t = Math.max(0,Math.ceil(state.time));
  const m = Math.floor(t/60), s = t%60;
  document.getElementById('timer').textContent = m+':'+String(s).padStart(2,'0');
  document.getElementById('status').textContent = state.time>0 ? 'Deploy troops · defend your towers' : 'Battle over';
}

document.getElementById('playAgain').addEventListener('click', ()=>{
  if(ONLINE){
    // simplest restart for online: reload the page back into the lobby
    location.reload();
  } else {
    newGame();
  }
});

document.getElementById('btnAI').addEventListener('click', ()=>{
  ONLINE = false;
  MY_ROLE = 'p1';
  document.getElementById('lobby').style.display = 'none';
  newGame();
});

document.getElementById('btnHost').addEventListener('click', ()=>{
  const code = randomRoomCode();
  MY_ROLE = 'p1';
  connectToRoom(code, true);
});

document.getElementById('btnJoin').addEventListener('click', ()=>{
  document.getElementById('lobbyMode').style.display = 'none';
  document.getElementById('lobbyJoinForm').style.display = 'flex';
});

document.getElementById('btnJoinGo').addEventListener('click', ()=>{
  const code = document.getElementById('joinCodeInput').value.trim();
  if(!code) return;
  connectToRoom(code, false);
});

// keep elixir bar / hand synced periodically for AI-caused changes not otherwise triggering UI
setInterval(()=>{ if(state) updateElixirBar(); }, 250);

updateTrophyDisplays();
requestAnimationFrame(loop);
})();
</script>
