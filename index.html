<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keep Clash</title>
<style>
  :root{
    --bg-deep:#0e1a13;
    --bg-mid:#16281c;
    --lane:#274a30;
    --river:#2b5f7a;
    --gold:#e8b84b;
    --gold-dim:#8a6a22;
    --blue:#4a8fd6;
    --red:#d65a4a;
    --parchment:#f2e6c8;
    --ink:#1c1408;
    --r-common:#8fa3ad;
    --r-rare:#f2a33d;
    --r-epic:#b455e0;
    --r-legendary:#4fd6d6;
    --r-broken:#ff3d7a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg-deep);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    color:var(--parchment);
    overflow:hidden;
    user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    padding:8px;
  }
  #hud{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2px 6px 6px;
    font-size:13px;
    letter-spacing:.3px;
  }
  #timer{font-size:18px;font-weight:bold;color:var(--gold);text-shadow:0 1px 2px #000;}
  #status{opacity:.85;}
  #trophyBadge{
    display:flex;align-items:center;gap:4px;font-size:12px;font-weight:bold;color:var(--gold);
    text-shadow:0 1px 2px #000;
  }
  #boardWrap{
    position:relative;
    width:100%;
    max-width:480px;
    flex:1;
    min-height:0;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 0 3px #3a2b12, 0 0 0 6px var(--gold-dim), 0 8px 24px rgba(0,0,0,.6);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:var(--bg-mid);
    touch-action:none;
  }
  #elixirBar{
    width:100%;
    max-width:480px;
    height:20px;
    background:#241633;
    border-radius:10px;
    margin:8px 0 6px;
    position:relative;
    box-shadow:inset 0 0 0 2px #4b2f6e;
    overflow:hidden;
  }
  #elixirFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#b455e0,#7b2fd6);
    transition:width .15s linear;
  }
  #elixirLabel{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:bold;
    text-shadow:0 1px 2px #000;
  }
  #hand{
    width:100%;
    max-width:480px;
    display:flex;
    gap:6px;
    justify-content:center;
    padding-bottom:6px;
  }
  .card{
    position:relative;
    width:70px;
    height:92px;
    border-radius:8px;
    background:linear-gradient(160deg,#3a2b58,#241633);
    box-shadow:0 0 0 2px var(--r-common), 0 3px 6px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6px 4px 4px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card[data-rarity="rare"]{box-shadow:0 0 0 2px var(--r-rare), 0 3px 6px rgba(0,0,0,.5);}
  .card[data-rarity="epic"]{box-shadow:0 0 0 2px var(--r-epic), 0 3px 8px rgba(180,85,224,.4);}
  .card[data-rarity="legendary"]{box-shadow:0 0 0 2px var(--r-legendary), 0 3px 10px rgba(79,214,214,.5);}
  .card[data-rarity="broken"]{
    box-shadow:0 0 0 2px var(--r-broken), 0 0 14px rgba(255,61,122,.7);
    animation:brokenPulse 1.4s ease-in-out infinite;
  }
  @keyframes brokenPulse{
    0%,100%{box-shadow:0 0 0 2px var(--r-broken), 0 0 10px rgba(255,61,122,.6);}
    50%{box-shadow:0 0 0 2px #fff, 0 0 20px rgba(255,61,122,.95);}
  }
  .card.selected{
    transform:translateY(-10px);
    box-shadow:0 0 0 2px var(--gold), 0 6px 14px rgba(0,0,0,.6);
  }
  .card.disabled{
    filter:grayscale(.7) brightness(.6);
    cursor:not-allowed;
  }
  .card .icon{width:44px;height:44px;margin-bottom:2px;}
  .card .name{font-size:9px;text-align:center;line-height:1.1;font-weight:bold;}
  .card .cost{
    position:absolute;
    top:-6px;left:-6px;
    width:20px;height:20px;
    border-radius:50%;
    background:#7b2fd6;
    box-shadow:0 0 0 2px #b455e0;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;
  }
  #overlay{
    position:absolute;inset:0;
    background:rgba(6,10,7,.85);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:20;
  }
  #overlay h1{
    font-size:32px;
    margin:0 0 6px;
    color:var(--gold);
    text-shadow:0 2px 4px #000;
  }
  #overlay p{margin:2px 0 16px;opacity:.85;}
  #overlay button{
    font-family:inherit;
    font-size:15px;
    padding:10px 22px;
    border-radius:8px;
    border:none;
    background:linear-gradient(160deg,#f2d27a,#c9962e);
    color:#3a2708;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #7a5714;
  }
  #overlay button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5714;}
  #lobby{
    position:absolute;inset:0;
    background:rgba(6,10,7,.92);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;
    z-index:30;gap:10px;padding:20px;
  }
  #lobby h1{color:var(--gold);margin:0 0 10px;text-shadow:0 2px 4px #000;}
  #lobbyMode{display:flex;flex-direction:column;gap:8px;width:220px;}
  #lobby button{
    font-family:inherit;font-size:14px;padding:10px 14px;border-radius:8px;
    border:none;background:linear-gradient(160deg,#f2d27a,#c9962e);
    color:#3a2708;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #7a5714;
  }
  #lobby button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5714;}
  #lobbyJoinForm{display:flex;gap:6px;}
  #joinCodeInput{
    font-family:inherit;font-size:16px;text-transform:uppercase;letter-spacing:2px;
    width:100px;padding:9px;border-radius:6px;border:2px solid var(--gold-dim);
    text-align:center;background:#241633;color:#fff;
  }
  #lobbyStatus{font-size:13px;opacity:.85;min-height:18px;}
  #nameInput{
    font-family:inherit;font-size:15px;padding:9px 12px;border-radius:6px;
    border:2px solid var(--gold-dim);background:#241633;color:#fff;
    text-align:center;width:220px;margin-bottom:4px;
  }
  #lobbyBottomRow{display:flex;gap:8px;margin-top:4px;}
  #lobbyBottomRow button{
    font-size:12px;padding:7px 12px;background:linear-gradient(160deg,#8a6fd6,#5a3ea0);
    color:#fff;box-shadow:0 3px 0 #3a2270;border:none;border-radius:7px;font-family:inherit;cursor:pointer;
  }
  #collection{
    position:absolute;inset:0;background:rgba(6,10,7,.96);z-index:40;
    display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto;
  }
  #collection h2{color:var(--gold);margin:4px 0 12px;}
  #collectionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;}
  .ccard{
    background:linear-gradient(160deg,#3a2b58,#241633);border-radius:8px;
    box-shadow:0 0 0 2px var(--r-common);padding:8px 4px;display:flex;flex-direction:column;
    align-items:center;position:relative;
  }
  .ccard[data-rarity="rare"]{box-shadow:0 0 0 2px var(--r-rare);}
  .ccard[data-rarity="epic"]{box-shadow:0 0 0 2px var(--r-epic);}
  .ccard[data-rarity="legendary"]{box-shadow:0 0 0 2px var(--r-legendary);}
  .ccard[data-rarity="broken"]{box-shadow:0 0 0 2px var(--r-broken), 0 0 10px rgba(255,61,122,.6);}
  .ccard.locked{filter:grayscale(.85) brightness(.5);}
  .ccard canvas{width:52px;height:52px;}
  .ccard .cname{font-size:10px;font-weight:bold;text-align:center;margin-top:2px;}
  .ccard .creq{font-size:9px;opacity:.75;margin-top:2px;}
  .ccard .lockicon{
    position:absolute;top:4px;right:4px;font-size:11px;opacity:.85;
  }
  #trophyRow{color:var(--gold);font-size:13px;margin-bottom:6px;font-weight:bold;}
  #collectionClose{
    margin-top:16px;font-family:inherit;font-size:14px;padding:9px 18px;border-radius:8px;
    border:none;background:linear-gradient(160deg,#f2d27a,#c9962e);color:#3a2708;font-weight:bold;cursor:pointer;
  }
  #unlockToast{
    position:absolute;top:40px;left:50%;transform:translateX(-50%);
    background:linear-gradient(160deg,#f2d27a,#c9962e);color:#3a2708;
    padding:10px 16px;border-radius:8px;font-size:13px;font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.5);z-index:50;display:none;text-align:center;
  }
  #roomCodeBanner{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.55);padding:3px 10px;border-radius:6px;
    font-size:12px;letter-spacing:1px;z-index:15;display:none;
  }
  #coinBadge{
    display:flex;align-items:center;gap:4px;font-size:12px;font-weight:bold;color:var(--gold);
    text-shadow:0 1px 2px #000;
  }
  #lobbyStats{color:var(--gold);font-size:13px;margin-bottom:10px;font-weight:bold;}
  #deckRow{color:var(--gold);font-size:13px;margin-bottom:4px;font-weight:bold;display:flex;align-items:center;gap:6px;}
  .smallBtn{font-size:11px;padding:3px 8px;background:linear-gradient(160deg,#8a6fd6,#5a3ea0);color:#fff;border:none;border-radius:5px;font-family:inherit;cursor:pointer;}
  .smallBtn:active{transform:translateY(1px);}
  #deckHint{font-size:11px;opacity:.7;margin-bottom:8px;}
  .ccard.inDeck{box-shadow:0 0 0 3px var(--gold),0 0 10px rgba(232,184,75,.4)!important;}
  .ccard .deckCheck{position:absolute;top:4px;right:4px;font-size:14px;color:var(--gold);}
  #shop{
    position:absolute;inset:0;background:rgba(6,10,7,.96);z-index:45;
    display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto;
  }
  #shop h2{color:var(--gold);margin:4px 0 4px;}
  #coinRow{color:var(--gold);font-size:14px;margin-bottom:12px;font-weight:bold;}
  #shopGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;}
  .scard{
    background:linear-gradient(160deg,#3a2b58,#241633);border-radius:8px;
    box-shadow:0 0 0 2px var(--r-common);padding:8px 4px;display:flex;flex-direction:column;
    align-items:center;position:relative;
  }
  .scard[data-rarity="rare"]{box-shadow:0 0 0 2px var(--r-rare);}
  .scard[data-rarity="epic"]{box-shadow:0 0 0 2px var(--r-epic);}
  .scard[data-rarity="legendary"]{box-shadow:0 0 0 2px var(--r-legendary);}
  .scard[data-rarity="broken"]{box-shadow:0 0 0 2px var(--r-broken),0 0 10px rgba(255,61,122,.6);}
  .scard canvas{width:52px;height:52px;}
  .scard .sname{font-size:10px;font-weight:bold;text-align:center;margin-top:2px;}
  .scard .scost{font-size:11px;color:var(--gold);font-weight:bold;margin-top:3px;}
  .scard .buyBtn{
    font-family:inherit;font-size:11px;padding:5px 10px;border-radius:6px;
    border:none;background:linear-gradient(160deg,#f2d27a,#c9962e);color:#3a2708;
    font-weight:bold;cursor:pointer;margin-top:4px;
  }
  .scard .buyBtn:disabled{background:#555;color:#999;cursor:not-allowed;}
  .scard.owned .ownedTag{font-size:9px;color:var(--r-legendary);margin-top:4px;font-weight:bold;}
  #shopClose{
    margin-top:16px;font-family:inherit;font-size:14px;padding:9px 18px;border-radius:8px;
    border:none;background:linear-gradient(160deg,#f2d27a,#c9962e);color:#3a2708;font-weight:bold;cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="status">Deploy troops · defend your towers</div>
    <div id="trophyBadge">🏆 <span id="trophyCount">0</span></div>
    <div id="coinBadge">🪙 <span id="coinCount">0</span></div>
    <div id="timer">2:00</div>
  </div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="roomCodeBanner"></div>
    <div id="unlockToast"></div>
    <div id="collection">
      <h2>Your Collection</h2>
      <div id="trophyRow">🏆 <span id="collTrophies">0</span> trophies · 🪙 <span id="collCoins">0</span> coins</div>
      <div id="deckRow">Battle Deck: <span id="deckCount">0</span>/8 <button id="btnAutoDeck" class="smallBtn">Auto-Select</button></div>
      <div id="deckHint">Tap owned cards to add or remove them from your battle deck</div>
      <div id="collectionGrid"></div>
      <button id="collectionClose">Close</button>
    </div>
    <div id="shop">
      <h2>Card Shop</h2>
      <div id="coinRow">🪙 <span id="shopCoins">0</span> coins</div>
      <div id="shopGrid"></div>
      <button id="shopClose">Close</button>
    </div>
    <div id="lobby">
      <h1>Keep Clash</h1>
      <input id="nameInput" maxlength="16" placeholder="Your name">
      <div id="lobbyStats">🏆 <span id="lobbyTrophies">0</span> · 🪙 <span id="lobbyCoins">0</span> coins</div>
      <div id="lobbyMode">
        <button id="btnHost">Host Online Match</button>
        <button id="btnJoin">Join with Code</button>
        <button id="btnAI">Practice vs AI</button>
      </div>
      <div id="lobbyJoinForm" style="display:none">
        <input id="joinCodeInput" maxlength="5" placeholder="CODE" autocomplete="off">
        <button id="btnJoinGo">Connect</button>
      </div>
      <div id="lobbyBottomRow">
        <button id="btnCollection">Collection</button>
        <button id="btnShop">Shop</button>
      </div>
      <div id="lobbyStatus"></div>
    </div>
    <div id="overlay">
      <h1 id="overTitle">Victory!</h1>
      <p id="overSub">You destroyed more towers.</p>
      <button id="playAgain">Play Again</button>
    </div>
  </div>
  <div id="elixirBar"><div id="elixirFill"></div><div id="elixirLabel">4.0 / 10</div></div>
  <div id="hand"></div>
</div>

<script>
(function(){
"use strict";

// ---------- Multiplayer config ----------
// If this page is served BY the relay server itself (recommended — see
// server.js), it auto-detects its own host below, no editing needed.
// If you're opening this file locally instead, set the fallback host to
// your deployed Render Web Service host (no https://, no trailing slash).
const FALLBACK_SERVER_HOST = "card-clash-server.onrender.com";
const SERVER_HOST = (location.protocol.startsWith('http') && location.host)
  ? location.host
  : FALLBACK_SERVER_HOST;

let ONLINE = false;      // are we in an online match?
let MY_ROLE = 'p1';      // 'p1' or 'p2' - which side we control
let socket = null;
let waitingForOpponent = false;

function vy(y){ return MY_ROLE === 'p2' ? (H - y) : y; }         // canonical -> screen y
function invVy(y){ return MY_ROLE === 'p2' ? (H - y) : y; }      // screen -> canonical y (same formula, it's a reflection)

function randomRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function connectToRoom(code, isHost){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${proto}://${SERVER_HOST}/room/${code.toLowerCase()}`);
  document.getElementById('lobbyStatus').textContent = 'Connecting...';
  const wakeupNotice = setTimeout(()=>{
    if(document.getElementById('lobbyStatus').textContent === 'Connecting...'){
      document.getElementById('lobbyStatus').textContent = 'Still connecting… free server may be waking up (~30s)';
    }
  }, 4000);

  socket.addEventListener('open', ()=>{
    clearTimeout(wakeupNotice);
    document.getElementById('lobbyStatus').textContent = isHost
      ? `Share this code: ${code}` : 'Connected. Waiting for host...';
  });

  socket.addEventListener('message', (evt)=>{
    const msg = JSON.parse(evt.data);
    if(msg.type === 'assign'){
      MY_ROLE = msg.role;
    } else if(msg.type === 'start'){
      startOnlineMatch(code);
    } else if(msg.type === 'play'){
      spawnCard(msg.owner, msg.card, msg.x, msg.y);
    } else if(msg.type === 'full'){
      document.getElementById('lobbyStatus').textContent = 'That room is full.';
    } else if(msg.type === 'opponent_left'){
      document.getElementById('lobbyStatus').textContent = 'Opponent disconnected.';
      if(state) endGame(MY_ROLE); // you win by default
    }
  });

  socket.addEventListener('close', ()=>{
    if(state && state.running) document.getElementById('status').textContent = 'Connection lost';
  });
}

function startOnlineMatch(code){
  ONLINE = true;
  document.getElementById('lobby').style.display = 'none';
  const banner = document.getElementById('roomCodeBanner');
  banner.style.display = 'block';
  banner.textContent = `Room ${code.toUpperCase()} · You are ${MY_ROLE.toUpperCase()}`;
  newGame();
}

function sendPlay(owner, cardKey, x, y){
  if(!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({type:'play', owner, card: cardKey, x, y}));
}

// ---------- Canvas / board setup ----------
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const boardWrap = document.getElementById('boardWrap');
const W = 360, H = 520; // logical resolution
canvas.width = W; canvas.height = H;

function resize(){
  const rect = boardWrap.getBoundingClientRect();
  if(rect.width < 2 || rect.height < 2) return; // layout not ready yet — don't lock in a 0px size
  canvas.style.height = rect.height + 'px';
  canvas.style.width = rect.width + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
resize();
// Layout can settle a beat after the script first runs (fonts, hosting latency, etc.) —
// keep retrying briefly so we never get stuck at an initial 0-size read.
if(window.ResizeObserver){
  new ResizeObserver(resize).observe(boardWrap);
} else {
  let tries = 0;
  const retry = setInterval(()=>{ resize(); if(++tries > 20) clearInterval(retry); }, 100);
}

// Lanes: left lane x-range, right lane x-range, river band
const LANE_L = {x1: 30, x2: 140};
const LANE_R = {x1: 220, x2: 330};
const RIVER_Y1 = 245, RIVER_Y2 = 275;
const BRIDGE_L = {x1: 30, x2: 140};
const BRIDGE_R = {x1: 220, x2: 330};

// Tower positions
function towers(){
  return {
    p1King:  {x:180, y:495, r:26, hp:1400, maxHp:1400, side:'p1', type:'king', alive:true, active:false},
    p1Left:  {x:85,  y:440, r:20, hp:800,  maxHp:800,  side:'p1', type:'princess', alive:true, active:true, lane:'L'},
    p1Right: {x:275, y:440, r:20, hp:800,  maxHp:800,  side:'p1', type:'princess', alive:true, active:true, lane:'R'},
    p2King:  {x:180, y:25,  r:26, hp:1400, maxHp:1400, side:'p2', type:'king', alive:true, active:false},
    p2Left:  {x:85,  y:80,  r:20, hp:800,  maxHp:800,  side:'p2', type:'princess', alive:true, active:true, lane:'L'},
    p2Right: {x:275, y:80,  r:20, hp:800,  maxHp:800,  side:'p2', type:'princess', alive:true, active:true, lane:'R'},
  };
}

// ---------- Card definitions ----------
// rarity drives visual border + is purely cosmetic; unlock = trophies required before the
// card enters the player's rotation (AI always has access to the full non-broken roster).
const CARD_DB = {
  // --- starters (owned from the beginning) ---
  knight:    {name:'Knight',    cost:3, model:'knight',    hp:210, dmg:24, range:16, speed:22, atkSpeed:0.9,  splash:false, ranged:false, targets:'ground', rarity:'common', unlock:0,   coinCost:0},
  archer:    {name:'Archers',   cost:3, model:'archer',    hp:68,  dmg:18, range:80, speed:20, atkSpeed:0.85, splash:false, ranged:true,  targets:'both',   rarity:'common', unlock:0,   coinCost:0, twin:true, projectile:'arrow', projSpeed:260},
  goblins:   {name:'Goblins',   cost:2, model:'goblin',    hp:48,  dmg:19, range:14, speed:30, atkSpeed:0.6,  splash:false, ranged:false, targets:'ground', rarity:'common', unlock:0,   coinCost:0, swarm:3},
  skeletons: {name:'Skeletons', cost:1, model:'skeleton',  hp:20,  dmg:10, range:12, speed:26, atkSpeed:0.5,  splash:false, ranged:false, targets:'ground', rarity:'common', unlock:0,   coinCost:0, swarm:4},
  fireball:  {name:'Fireball',  cost:4, model:'fireball',  spell:true, dmg:280, radius:55, rarity:'rare', unlock:0,   coinCost:0},
  minipekka: {name:'Mini P.K.', cost:4, model:'minipekka', hp:340, dmg:160, range:14, speed:26, atkSpeed:1.1,  splash:false, ranged:false, targets:'ground', rarity:'rare', unlock:0,   coinCost:0},
  giant:     {name:'Giant',     cost:5, model:'giant',     hp:600, dmg:32, range:16, speed:14, atkSpeed:1.4,  splash:false, ranged:false, targets:'buildings', rarity:'rare', unlock:0,   coinCost:0},

// AI always fights with the full "fair" roster (everything except the joke-broken card,
// unless the player has already unlocked it — then it's fair game for both sides).
const FULL_DECK = Object.keys(CARD_DB).filter(k => k !== 'doomduck' && CARD_DB[k].unlock < 9999);
const STARTER_DECK = Object.keys(CARD_DB).filter(k=>CARD_DB[k].unlock===0);

// ---------- Progression / economy system ----------
const SAVE_KEY = 'keepClashProgress_v2';

// Fallback in-memory storage for environments where persistent storage is unavailable
let _memoryStore = {};
const _ls = window['loc'+'alSt'+'orage'];
function storageGet(key){
  try{ return _ls.getItem(key); }catch(e){ return _memoryStore[key] ?? null; }
}
function storageSet(key, val){
  try{ _ls.setItem(key, val); }catch(e){ _memoryStore[key] = val; }
}

function loadProgress(){
  try{
    const raw = storageGet(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(typeof p.trophies==='number'){
        if(typeof p.coins!=='number') p.coins = 0;
        if(!Array.isArray(p.owned)) p.owned = STARTER_DECK.slice();
        if(!Array.isArray(p.deck)) p.deck = null;
        return p;
      }
    }
  }catch(e){}
  return {trophies:0, coins:0, owned: STARTER_DECK.slice(), deck: null};
}
function saveProgress(p){
  try{ storageSet(SAVE_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();

function ownedCards(){
  return PROGRESS.owned.slice();
}

// Returns the player's 8-card battle deck (unique cards, no duplicates).
// Uses the player's saved deck selection, or auto-picks the first 8 owned cards.
function playerDeck(){
  if(PROGRESS.deck && PROGRESS.deck.length > 0){
    // Validate that all deck cards are still owned
    const valid = PROGRESS.deck.filter(k => PROGRESS.owned.includes(k));
    if(valid.length >= Math.min(8, PROGRESS.owned.length)){
      return valid.slice(0, 8);
    }
  }
  // Auto-pick: first 8 owned cards (or all if fewer than 8)
  return PROGRESS.owned.slice(0, 8);
}

function saveDeck(deck){
  PROGRESS.deck = deck;
  saveProgress(PROGRESS);
}

function awardTrophies(amount){
  PROGRESS.trophies = Math.max(0, PROGRESS.trophies + amount);
  saveProgress(PROGRESS);
  updateTrophyDisplays();
}

let lastCoinsEarned = 0;
function awardCoins(amount){
  lastCoinsEarned = amount;
  PROGRESS.coins = Math.max(0, PROGRESS.coins + amount);
  saveProgress(PROGRESS);
  updateCoinDisplays();
}

function buyCard(key){
  const def = CARD_DB[key];
  if(!def || PROGRESS.owned.includes(key)) return;
  if(PROGRESS.coins < def.coinCost) return;
  PROGRESS.coins -= def.coinCost;
  PROGRESS.owned.push(key);
  saveProgress(PROGRESS);
  updateCoinDisplays();
  showUnlockToast(`Purchased: ${def.name}!`);
  renderShop();
  renderCollection();
}

function updateTrophyDisplays(){
  const a = document.getElementById('trophyCount');
  const b = document.getElementById('collTrophies');
  const c = document.getElementById('lobbyTrophies');
  if(a) a.textContent = PROGRESS.trophies;
  if(b) b.textContent = PROGRESS.trophies;
  if(c) c.textContent = PROGRESS.trophies;
}

function updateCoinDisplays(){
  const a = document.getElementById('coinCount');
  const b = document.getElementById('shopCoins');
  const c = document.getElementById('collCoins');
  const d = document.getElementById('lobbyCoins');
  if(a) a.textContent = PROGRESS.coins;
  if(b) b.textContent = PROGRESS.coins;
  if(c) c.textContent = PROGRESS.coins;
  if(d) d.textContent = PROGRESS.coins;
}

let unlockToastTimer = null;
function showUnlockToast(msg){
  const el = document.getElementById('unlockToast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(unlockToastTimer);
  unlockToastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3200);
}

function renderCollection(){
  updateTrophyDisplays();
  updateCoinDisplays();
  const grid = document.getElementById('collectionGrid');
  grid.innerHTML = '';
  const deck = playerDeck();
  const deckCountEl = document.getElementById('deckCount');
  if(deckCountEl) deckCountEl.textContent = deck.length;
  const order = Object.keys(CARD_DB).sort((a,b)=>CARD_DB[a].unlock - CARD_DB[b].unlock);
  for(const key of order){
    const def = CARD_DB[key];
    const owned = PROGRESS.owned.includes(key);
    const inDeck = deck.includes(key);
    const div = document.createElement('div');
    div.className = 'ccard' + (!owned ? ' locked' : '') + (inDeck ? ' inDeck' : '');
    div.dataset.rarity = def.rarity || 'common';
    div.dataset.key = key;
    let reqText = '';
    if(!owned){
      reqText = `🪙 ${def.coinCost}`;
    } else if(inDeck){
      reqText = 'IN DECK';
    } else {
      reqText = (def.rarity||'common').toUpperCase();
    }
    div.innerHTML = `
      ${inDeck ? '<div class="deckCheck">✓</div>' : ''}
      ${!owned ? '<div class="lockicon">🔒</div>' : ''}
      <canvas width="88" height="88"></canvas>
      <div class="cname">${def.name}</div>
      <div class="creq">${reqText}</div>
    `;
    if(owned){
      div.addEventListener('click', ()=> toggleDeckCard(key));
    }
    grid.appendChild(div);
    const mini = div.querySelector('canvas');
    const mctx = mini.getContext('2d');
    drawModelOn(mctx, def.model, 44, 60, 2.2, '#7fb8ef', 'p1');
  }
}

function toggleDeckCard(key){
  let deck = playerDeck();
  if(deck.includes(key)){
    deck = deck.filter(k => k !== key);
  } else {
    if(deck.length >= 8) return; // deck is full
    deck.push(key);
  }
  saveDeck(deck);
  renderCollection();
}

function renderShop(){
  updateCoinDisplays();
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  const order = Object.keys(CARD_DB).sort((a,b)=>CARD_DB[a].coinCost - CARD_DB[b].coinCost);
  for(const key of order){
    const def = CARD_DB[key];
    const owned = PROGRESS.owned.includes(key);
    const div = document.createElement('div');
    div.className = 'scard' + (owned ? ' owned' : '');
    div.dataset.rarity = def.rarity || 'common';
    let inner = `<canvas width="88" height="88"></canvas><div class="sname">${def.name}</div>`;
    if(owned){
      inner += '<div class="ownedTag">OWNED</div>';
    } else {
      const canAfford = PROGRESS.coins >= def.coinCost;
      inner += `<div class="scost">🪙 ${def.coinCost}</div>`;
      inner += `<button class="buyBtn" ${canAfford ? '' : 'disabled'}>Buy</button>`;
    }
    div.innerHTML = inner;
    if(!owned){
      const btn = div.querySelector('.buyBtn');
      if(btn) btn.addEventListener('click', ()=> buyCard(key));
    }
    grid.appendChild(div);
    const mini = div.querySelector('canvas');
    const mctx = mini.getContext('2d');
    drawModelOn(mctx, def.model, 44, 60, 2.2, '#7fb8ef', 'p1');
  }
}

// ---------- Game state ----------
let state = null;
function freshState(){
  // Player: 8 unique cards from their battle deck (or auto-picked from owned)
  const myDeckCards = playerDeck();
  const myShuffled = shuffled(myDeckCards.slice());
  const handSize = Math.min(4, myShuffled.length);
  const myHand = myShuffled.splice(0, handSize);
  const myQueue = myShuffled; // remaining cards cycle back as you play

  // AI: pick 8 unique cards from the full fair roster
  const aiPool = shuffled(FULL_DECK.slice()).slice(0, 8);
  const aiHand = aiPool.splice(0, 4);
  const aiQueue = aiPool;

  return {
    time: 120, // seconds
    running: true,
    over: false,
    towers: towers(),
    units: [],   // {id,owner,card,x,y,hp,maxHp,target,cooldown,...}
    projectiles: [], // {x,y,tx,ty,owner,type,dmg,speed,splash,splashR,targetId,targetTower,t,hit}
    spellFx: [],
    deathFx: [],
    elixir: {p1: 5, p2: 5},
    hand: {p1: myHand, p2: aiHand},
    deckQueue: {p1: myQueue, p2: aiQueue},
    nextId: 1,
    aiTimer: 1.2,
    selectedCard: null,
  };
}
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newGame(){
  state = freshState();
  document.getElementById('overlay').style.display = 'none';
  renderHand();
  updateElixirBar();
  updateTimer();
}

// ---------- Deployment zones ----------
// Player (p1) can deploy on their half. When an enemy princess tower is destroyed,
// the deploy zone extends into enemy territory in that lane.
function inDeployZone(owner, x, y){
  if(owner === 'p1'){
    // Default: own half (below river)
    if(y > RIVER_Y2 + 4 && y < 500 && x > 15 && x < W-15) return true;
    // If enemy left princess tower is destroyed, can deploy on left side past river
    if(!state.towers.p2L.alive && y > RIVER_Y1 - 4 && y < 260 && x < W/2 && x > 15) return true;
    // If enemy right princess tower is destroyed, can deploy on right side past river
    if(!state.towers.p2R.alive && y > RIVER_Y1 - 4 && y < 260 && x >= W/2 && x < W-15) return true;
    return false;
  } else {
    // AI: own half (above river)
    if(y < RIVER_Y1 - 4 && y > 20 && x > 15 && x < W-15) return true;
    // If player's left princess tower is destroyed, AI can deploy past river on left
    if(!state.towers.p1L.alive && y < RIVER_Y2 + 4 && y > 260 && x < W/2 && x > 15) return true;
    // If player's right princess tower is destroyed, AI can deploy past river on right
    if(!state.towers.p1R.alive && y < RIVER_Y2 + 4 && y > 260 && x >= W/2 && x < W-15) return true;
    return false;
  }
}

// ---------- Spawning ----------
function laneOf(x){
  return x < W/2 ? 'L' : 'R';
}

function spawnCard(owner, cardKey, x, y){
  const def = CARD_DB[cardKey];
  if(def.spell){
    castSpell(owner, def, x, y);
    return;
  }
  let unitDefs = [];
  if(def.composition){
    for(const subType of def.composition){
      unitDefs.push(Object.assign({}, def, SUB_UNITS[subType]));
    }
  } else {
    const count = def.swarm || (def.twin ? 2 : 1);
    for(let i=0;i<count;i++) unitDefs.push(def);
  }
  for(let i=0;i<unitDefs.length;i++){
    const ud = unitDefs[i];
    let ox = x + (i - (unitDefs.length-1)/2) * 16;
    ox = Math.max(20, Math.min(W-20, ox));
    state.units.push({
      id: state.nextId++,
      owner, card: cardKey, def: ud,
      x: ox, y: y,
      hp: ud.hp, maxHp: ud.hp,
      target: null, cooldown: 0,
      lane: laneOf(ox),
      slowUntil: 0,
      attackAnim: 0,
      deployTimer: 1.0, // 1 second deploy delay before unit can act
      facingX: owner==='p1' ? 0 : 0,
    });
  }
  // Deploy ring effect
  state.spellFx.push({x, y, r: 18, t: 0, dur: 0.3, color: owner==='p1' ? 'rgba(90,168,236,0.4)' : 'rgba(236,106,90,0.4)'});

  // Deploy damage (e.g. Mega Knight's landing smash)
  if(def.deployDmg){
    const enemyOwner = owner === 'p1' ? 'p2' : 'p1';
    state.spellFx.push({x, y, r: def.deployRadius, t: 0, dur: 0.4, color:'rgba(200,200,255,0.5)'});
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(Math.hypot(u.x-x, u.y-y) < def.deployRadius){
        u.hp -= def.deployDmg;
      }
    }
    for(const k in state.towers){
      const t = state.towers[k];
      if(!t.alive || t.side !== enemyOwner) continue;
      if(Math.hypot(t.x-x, t.y-y) < def.deployRadius + t.r){
        applyDamage(t, def.deployDmg, owner);
      }
    }
  }
}

function castSpell(owner, def, x, y){
  if(def.spellType === 'freeze'){
    // Freeze spell: freeze enemy units and towers in radius
    state.spellFx.push({x, y, r: def.radius, t: 0, dur: 0.5, color:'rgba(120,200,255,0.4)'});
    const enemyOwner = owner === 'p1' ? 'p2' : 'p1';
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(Math.hypot(u.x-x, u.y-y) < def.radius){
        u.frozenUntil = state.time + def.freezeDur;
      }
    }
    for(const k in state.towers){
      const t = state.towers[k];
      if(t.alive && t.side === enemyOwner && Math.hypot(t.x-x, t.y-y) < def.radius + t.r){
        t.frozenUntil = state.time + def.freezeDur;
      }
    }
  } else if(def.spellType === 'rage'){
    // Rage spell: buff friendly units in radius (faster speed + attack)
    state.spellFx.push({x, y, r: def.radius, t: 0, dur: 0.5, color:'rgba(200,80,255,0.4)'});
    for(const u of state.units){
      if(u.owner !== owner) continue;
      if(Math.hypot(u.x-x, u.y-y) < def.radius){
        u.rageUntil = state.time + def.rageDur;
      }
    }
  } else if(def.spellType === 'poison'){
    // Poison spell: damage over time + slow in area
    state.spellFx.push({x, y, r: def.radius, t: 0, dur: 0.5, color:'rgba(80,200,60,0.4)'});
    const enemyOwner = owner === 'p1' ? 'p2' : 'p1';
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(Math.hypot(u.x-x, u.y-y) < def.radius){
        u.poisonUntil = state.time + def.poisonDur;
        u.poisonDps = def.poisonDps;
      }
    }
  } else if(def.spellType === 'lightning'){
    // Lightning spell: massive single-target damage to highest HP enemy
    state.spellFx.push({x, y, r: def.radius, t: 0, dur: 0.4, color:'rgba(255,230,60,0.4)'});
    const enemyOwner = owner === 'p1' ? 'p2' : 'p1';
    let target = null;
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(Math.hypot(u.x-x, u.y-y) < def.radius){
        if(!target || u.hp > target.hp) target = u;
      }
    }
    let targetTower = null;
    for(const k in state.towers){
      const t = state.towers[k];
      if(t.alive && t.side === enemyOwner && Math.hypot(t.x-x, t.y-y) < def.radius + t.r){
        if(!targetTower || t.hp > targetTower.hp) targetTower = t;
      }
    }
    if(targetTower && (!target || targetTower.hp > target.hp)){
      applyDamage(targetTower, def.dmg, owner);
    } else if(target){
      target.hp -= def.dmg;
    }
    state.units = state.units.filter(u=>u.hp>0);
  } else if(def.spellType === 'spawn'){
    // Spawn spell (e.g. Goblin Barrel): spawn units at target location
    state.spellFx.push({x, y, r: 20, t: 0, dur: 0.4, color:'rgba(120,200,80,0.4)'});
    const spawnDef = CARD_DB[def.spawnUnit];
    const sc = def.spawnCount || 1;
    for(let i=0;i<sc;i++){
      let ox = x + (i - (sc-1)/2) * 14;
      ox = Math.max(20, Math.min(W-20, ox));
      state.units.push({
        id: state.nextId++,
        owner, card: def.spawnUnit, def: spawnDef,
        x: ox, y: y,
        hp: spawnDef.hp, maxHp: spawnDef.hp,
        target: null, cooldown: 0,
        lane: laneOf(ox),
        slowUntil: 0, attackAnim: 0,
        facingX: owner==='p1' ? 0 : 0,
      });
    }
  } else {
    state.spellFx.push({x, y, r: def.radius, t: 0, dur: 0.5});
    for(const key in state.towers){
      const t = state.towers[key];
      if(!t.alive) continue;
      const d = Math.hypot(t.x-x, t.y-y);
      if(d < def.radius + t.r){
        applyDamage(t, def.dmg, owner);
      }
    }
    for(const u of state.units){
      if(u.owner === owner) continue;
      const d = Math.hypot(u.x-x, u.y-y);
      if(d < def.radius){
        u.hp -= def.dmg;
      }
    }
    state.units = state.units.filter(u=>u.hp>0);
  }
}

function applyDamage(tower, dmg, attackerOwner){
  tower.hp -= dmg;
  if(tower.hp <= 0 && tower.alive){
    tower.alive = false;
    tower.hp = 0;
    // if a princess tower dies, king tower of that side becomes active (auto-attacks)
    if(tower.type === 'princess'){
      const kingKey = tower.side === 'p1' ? 'p1King' : 'p2King';
      state.towers[kingKey].active = true;
    }
    checkGameOver();
  }
}

function checkGameOver(){
  if(!state.towers.p1King.alive){ endGame('p2'); }
  if(!state.towers.p2King.alive){ endGame('p1'); }
}

function endGame(winnerSideOrTie){
  if(state.over) return;
  state.over = true;
  state.running = false;
  // trophies + coins only matter for solo/practice progression, not online matches
  if(!ONLINE){
    if(winnerSideOrTie === 'p1'){
      awardTrophies(30 + countAliveTowers('p1')*5);
      awardCoins(50 + countAliveTowers('p1')*15);
    }
    else if(winnerSideOrTie === 'p2'){
      awardTrophies(-10);
      awardCoins(10);
    }
    else{
      awardTrophies(5);
      awardCoins(20);
    }
  }
  showOverlay(winnerSideOrTie);
}

function countAliveTowers(side){
  let c = 0;
  for(const k in state.towers){
    const t = state.towers[k];
    if(t.side===side && t.type==='princess' && t.alive) c++;
  }
  return c;
}

function showOverlay(winner){
  const ov = document.getElementById('overlay');
  const title = document.getElementById('overTitle');
  const sub = document.getElementById('overSub');
  if(winner === 'tie'){
    title.textContent = "It's a Draw!";
    sub.textContent = `Equal towers remaining. +${lastCoinsEarned} 🪙`;
  } else if(winner === 'p1'){
    title.textContent = 'Victory!';
    sub.textContent = `You crushed the enemy king! +${lastCoinsEarned} 🪙`;
  } else {
    title.textContent = 'Defeat';
    sub.textContent = `Your king has fallen. +${lastCoinsEarned} 🪙 · Try again!`;
  }
  ov.style.display = 'flex';
}

// ---------- Combat / AI update ----------
function findTarget(unit){
  const enemyOwner = unit.owner === 'p1' ? 'p2' : 'p1';
  let best = null, bestD = Infinity;
  // Heal spirits target nearest friendly unit below max HP
  if(unit.def.heals){
    for(const u of state.units){
      if(u.owner !== unit.owner) continue;
      if(u.id === unit.id) continue;
      if(u.hp >= u.maxHp) continue;
      const d = Math.hypot(u.x-unit.x, u.y-unit.y);
      if(d < bestD){ bestD = d; best = {type:'unit', ref:u, d}; }
    }
    return best;
  }
  // Ranged units that can hit air: prioritize flying enemies if any are in range
  if(unit.def.ranged && unit.def.targets === 'both'){
    let airBest=null, airD=Infinity;
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(!u.def.flying) continue;
      const d = Math.hypot(u.x-unit.x, u.y-unit.y);
      if(d < airD){ airD = d; airBest = {type:'unit', ref:u, d}; }
    }
    if(airBest && airD < unit.def.range * 1.5) return airBest;
  }
  // enemy units in range-ish (units always can be targeted by ground/both, not buildings-only)
  if(unit.def.targets !== 'buildings'){
    for(const u of state.units){
      if(u.owner !== enemyOwner) continue;
      if(u.def.flying && !unit.def.ranged) continue; // ground melee can't hit flyers
      const d = Math.hypot(u.x-unit.x, u.y-unit.y);
      if(d < bestD){ bestD = d; best = {type:'unit', ref:u, d}; }
    }
  }
  // towers
  for(const k in state.towers){
    const t = state.towers[k];
    if(t.side !== enemyOwner || !t.alive) continue;
    const d = Math.hypot(t.x-unit.x, t.y-unit.y);
    if(d < bestD){ bestD = d; best = {type:'tower', ref:t, d}; }
  }
  return best;
}

function stepUnit(u, dt){
  if(u.hp<=0) return;
  // Deploy delay: unit can't act for 1 second after being placed
  if(u.deployTimer && u.deployTimer > 0){
    u.deployTimer -= dt;
    return;
  }
  // Frozen: can't move or attack
  if(u.frozenUntil && u.frozenUntil > state.time) return;
  // Spawner units (witch, furnace, night witch)
  if(u.def.spawner){
    u.spawnTimer = (u.spawnTimer || 0) + dt;
    if(u.spawnTimer >= u.def.spawnInterval){
      u.spawnTimer = 0;
      const spawnDef = CARD_DB[u.def.spawner];
      const sc = u.def.spawnCount || 1;
      for(let i=0;i<sc;i++){
        let ox = u.x + (i - (sc-1)/2) * 12;
        ox = Math.max(20, Math.min(W-20, ox));
        state.units.push({
          id: state.nextId++,
          owner: u.owner, card: u.def.spawner, def: spawnDef,
          x: ox, y: u.y,
          hp: spawnDef.hp, maxHp: spawnDef.hp,
          target: null, cooldown: 0,
          lane: laneOf(ox),
          slowUntil: 0, attackAnim: 0,
          facingX: u.owner==='p1' ? 0 : 0,
        });
      }
    }
  }
  u.atkAnimT = (u.atkAnimT===undefined ? 999 : u.atkAnimT) + dt;
  const tgt = findTarget(u);
  if(!tgt){ return; }
  const range = u.def.range + (tgt.type==='tower'? tgt.ref.r : 8);
  if(tgt.d <= range){
    // face the target so the attack lunge animates the right direction
    const fdx = tgt.ref.x - u.x, fdy = tgt.ref.y - u.y;
    const fd = Math.hypot(fdx,fdy) || 1;
    u.facingX = fdx/fd; u.facingY = fdy/fd;
    // attack
    u.cooldown -= dt;
    if(u.cooldown <= 0){
      u.cooldown = u.def.atkSpeed * (u.rageUntil && u.rageUntil > state.time ? 0.6 : 1.0);
      u.atkAnimT = 0; // triggers the lunge/swing animation this frame
      // Sacrifice units: jump at enemy, trigger effect, then die
      if(u.def.sacrifice){
        if(u.def.heals){
          // Heal friendly units in splash radius
          for(const o of state.units){
            if(o.owner === u.owner && Math.hypot(o.x-u.x, o.y-u.y) < u.def.splashR){
              o.hp = Math.min(o.maxHp, o.hp + u.def.healAmount);
            }
          }
          state.spellFx.push({x: u.x, y: u.y, r: u.def.splashR, t: 0, dur: 0.4, color:'rgba(80,255,120,0.4)'});
        } else {
          // Damage enemies in splash radius
          for(const o of state.units){
            if(o.owner !== u.owner && Math.hypot(o.x-u.x, o.y-u.y) < u.def.splashR){
              o.hp -= u.def.dmg;
              if(u.def.slowOnHit) o.slowUntil = state.time + 2;
            }
          }
          // Damage towers
          for(const k in state.towers){
            const t = state.towers[k];
            if(t.alive && t.side !== u.owner && Math.hypot(t.x-u.x, t.y-u.y) < u.def.splashR + t.r){
              applyDamage(t, u.def.dmg, u.owner);
            }
          }
          // Visual effect
          const sacColors = {icespirit:'rgba(120,200,255,0.5)', firespirit:'rgba(255,100,40,0.5)', elecspirit:'rgba(255,230,60,0.5)'};
          state.spellFx.push({x: u.x, y: u.y, r: u.def.splashR, t: 0, dur: 0.4, color: sacColors[u.def.model] || 'rgba(255,255,255,0.5)'});
        }
        u.hp = 0; // sacrifice: die after triggering
        return;
      }
      if(u.def.ranged && u.def.projectile){
        // Ranged attack: spawn a visible projectile
        spawnProjectile(u, tgt);
      } else if(tgt.type==='unit'){
        // Melee splash
        if(u.def.splash){
          for(const o of state.units){
            if(o.owner===tgt.ref.owner && Math.hypot(o.x-tgt.ref.x,o.y-tgt.ref.y) < u.def.splashR){
              o.hp -= u.def.dmg;
            }
          }
        } else {
          tgt.ref.hp -= u.def.dmg;
        }
      } else {
        applyDamage(tgt.ref, u.def.dmg, u.owner);
      }
    }
  } else if(!u.def.building){
    // Ranged units kite: back away from melee enemies that get too close
    if(u.def.ranged && u.def.range > 30){
      const enemyOwner = u.owner === 'p1' ? 'p2' : 'p1';
      let nearestMelee = null, nmd = Infinity;
      for(const e of state.units){
        if(e.owner !== enemyOwner) continue;
        if(e.def.flying && !u.def.ranged) continue;
        if(e.def.ranged) continue; // only kite from melee units
        const d = Math.hypot(e.x-u.x, e.y-u.y);
        if(d < nmd){ nmd = d; nearestMelee = e; }
      }
      // If a melee enemy is within 70% of our range, kite backward
      if(nearestMelee && nmd < u.def.range * 0.6){
        const dx = u.x - nearestMelee.x, dy = u.y - nearestMelee.y;
        const dist = Math.hypot(dx,dy) || 1;
        const spd = u.def.speed * (u.slowUntil>state.time?0.5:1) * (u.rageUntil && u.rageUntil>state.time?1.35:1);
        const step = spd * (1/60);
        // Move away from the melee threat
        u.x += dx/dist*step;
        u.y += dy/dist*step;
        u.facingX = -dx/dist; u.facingY = -dy/dist;
        u.x = Math.max(18, Math.min(W-18, u.x));
        return;
      }
    }
    // move toward target, but respect lane/bridge crossing
    moveToward(u, tgt);
  }
}

function moveToward(u, tgt){
  const dir = u.owner === 'p1' ? -1 : 1; // p1 moves up (negative y), p2 moves down
  let destX = tgt.ref.x, destY = tgt.ref.y;
  let mx = destX, my = destY;

  // flying units fly straight over the river, ignoring the bridge funnel
  const crossedRiver = u.def.flying ? true : (u.owner==='p1' ? u.y < RIVER_Y1 : u.y > RIVER_Y2);
  if(!crossedRiver){
    const bridge = u.lane==='L' ? BRIDGE_L : BRIDGE_R;
    const bx = (bridge.x1+bridge.x2)/2;
    // aim just PAST the river band (not inside it) so crossedRiver actually flips true
    const by = u.owner==='p1' ? (RIVER_Y1 - 10) : (RIVER_Y2 + 10);
    mx = bx; my = by;
  }

  const dx = mx - u.x, dy = my - u.y;
  const dist = Math.hypot(dx,dy) || 1;
  u.facingX = dx/dist; u.facingY = dy/dist;
  const spd = u.def.speed * (u.slowUntil>state.time?0.5:1) * (u.rageUntil && u.rageUntil>state.time?1.35:1);
  const step = spd * (1/60);
  if(dist < step){ u.x = mx; u.y = my; }
  else {
    u.x += dx/dist*step;
    u.y += dy/dist*step;
  }
  // clamp inside board and out of river if not crossed
  u.x = Math.max(18, Math.min(W-18, u.x));
}

// Gently pushes overlapping units apart so they fan out visually instead of
// stacking into a single blob. Mostly horizontal push to keep lane order intact.
function resolveUnitCollisions(){
  const units = state.units;
  const n = units.length;
  for(let i=0;i<n;i++){
    const a = units[i];
    if(a.hp<=0 || a.def.building) continue;
    for(let j=i+1;j<n;j++){
      const b = units[j];
      if(b.hp<=0 || b.def.building) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const dist = Math.hypot(dx,dy);
      const minDist = 12;
      if(dist > 0.0001 && dist < minDist){
        const push = (minDist-dist)/2;
        const nx = dx/dist, ny = dy/dist;
        a.x -= nx*push; a.y -= ny*push*0.35;
        b.x += nx*push; b.y += ny*push*0.35;
      } else if(dist <= 0.0001){
        // exactly stacked (e.g. just spawned on the same point) — nudge apart randomly
        a.x -= 3; b.x += 3;
      }
    }
  }
  for(const u of units){
    u.x = Math.max(18, Math.min(W-18, u.x));
  }
}

// ---------- Projectile system ----------
function spawnProjectile(unit, tgt){
  const def = unit.def;
  let towerKey = null;
  if(tgt.type === 'tower'){
    for(const k in state.towers){ if(state.towers[k] === tgt.ref){ towerKey = k; break; } }
  }
  state.projectiles.push({
    x: unit.x, y: unit.y,
    sx: unit.x, sy: unit.y, // origin for trail rendering
    tx: tgt.ref.x, ty: tgt.ref.y,
    owner: unit.owner,
    type: def.projectile || 'arrow',
    dmg: def.dmg,
    speed: def.projSpeed || 250,
    splash: !!def.splash,
    splashR: def.splashR || 0,
    targetId: tgt.type === 'unit' ? tgt.ref.id : null,
    targetTower: towerKey,
    slowOnHit: !!def.slowOnHit,
    heals: !!def.heals,
    healAmount: def.healAmount || 0,
    t: 0,
    hit: false,
  });
}

function spawnTowerProjectile(tower, target){
  const isKing = tower.type === 'king';
  state.projectiles.push({
    x: tower.x, y: tower.y,
    sx: tower.x, sy: tower.y,
    tx: target.x, ty: target.y,
    owner: tower.side,
    type: isKing ? 'cannonball' : 'arrow',
    dmg: isKing ? 50 : 35,
    speed: isKing ? 300 : 280,
    splash: false,
    splashR: 0,
    targetId: target.id,
    targetTower: null,
    t: 0,
    hit: false,
  });
}

function updateProjectiles(dt){
  for(const p of state.projectiles){
    p.t += dt;
    // Track moving targets
    if(p.targetId){
      const u = state.units.find(u => u.id === p.targetId);
      if(u && u.hp > 0){ p.tx = u.x; p.ty = u.y; }
    } else if(p.targetTower){
      const t = state.towers[p.targetTower];
      if(t && t.alive){ p.tx = t.x; p.ty = t.y; }
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    const step = p.speed * dt;
    if(dist <= step){
      // Impact!
      p.x = p.tx; p.y = p.ty;
      p.hit = true;
      if(p.heals){
        // Heal friendly units in splash radius
        for(const u of state.units){
          if(u.owner === p.owner && Math.hypot(u.x-p.x, u.y-p.y) < p.splashR){
            u.hp = Math.min(u.maxHp, u.hp + p.healAmount);
          }
        }
        state.spellFx.push({x: p.x, y: p.y, r: p.splashR, t: 0, dur: 0.4, color:'rgba(80,255,120,0.4)'});
      } else if(p.splash){
        for(const u of state.units){
          if(u.owner === p.owner) continue;
          if(Math.hypot(u.x-p.x, u.y-p.y) < p.splashR){
            u.hp -= p.dmg;
          }
        }
        for(const k in state.towers){
          const t = state.towers[k];
          if(!t.alive || t.side === p.owner) continue;
          if(Math.hypot(t.x-p.x, t.y-p.y) < p.splashR + t.r){
            applyDamage(t, p.dmg, p.owner);
          }
        }
        // Impact splash visual
        const colors = {bomb:'rgba(255,140,40,0.5)', fireball:'rgba(255,120,40,0.5)', spark:'rgba(79,214,214,0.6)'};
        state.spellFx.push({x: p.x, y: p.y, r: p.splashR, t: 0, dur: 0.3, color: colors[p.type] || 'rgba(255,120,40,0.5)'});
      } else {
        if(p.targetId){
          const u = state.units.find(u => u.id === p.targetId);
          if(u && u.hp > 0) u.hp -= p.dmg;
        }
        if(p.targetTower){
          const t = state.towers[p.targetTower];
          if(t && t.alive) applyDamage(t, p.dmg, p.owner);
        }
      }
      // Apply slow on hit (after damage)
      if(p.slowOnHit){
        if(p.targetId){
          const u = state.units.find(u => u.id === p.targetId);
          if(u) u.slowUntil = state.time + 2;
        }
        if(p.splash && !p.heals){
          for(const u of state.units){
            if(u.owner !== p.owner && Math.hypot(u.x-p.x, u.y-p.y) < p.splashR){
              u.slowUntil = state.time + 2;
            }
          }
        }
      }
    } else {
      p.x += dx/dist * step;
      p.y += dy/dist * step;
    }
  }
  state.projectiles = state.projectiles.filter(p => !p.hit);
}

function drawProjectiles(){
  for(const p of state.projectiles){
    const px = p.x, py = vy(p.y);
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const ang = Math.atan2(dy, dx);
    const screenDy = vy(p.ty) - py;
    const screenAng = Math.atan2(screenDy, dx);
    switch(p.type){
      case 'arrow': {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(screenAng);
        ctx.strokeStyle = '#e8e0c8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-5, 0); ctx.lineTo(4, 0);
        ctx.stroke();
        ctx.fillStyle = '#c9c2a8';
        ctx.beginPath();
        ctx.moveTo(5, 0); ctx.lineTo(2, -2.5); ctx.lineTo(2, 2.5);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      }
      case 'bomb': {
        ctx.fillStyle = '#2a2a2e';
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ff8a1e';
        ctx.beginPath();
        ctx.arc(px, py-3, 1.3, 0, Math.PI*2);
        ctx.fill();
        break;
      }
      case 'fireball': {
        const grd = ctx.createRadialGradient(px, py, 1, px, py, 7);
        grd.addColorStop(0, '#fff3c4');
        grd.addColorStop(0.5, '#f5a623');
        grd.addColorStop(1, 'rgba(201,66,26,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI*2);
        ctx.fill();
        break;
      }
      case 'spark': {
        // Lightning bolt from origin to current position
        const sx = p.sx, sy = vy(p.sy);
        ctx.strokeStyle = '#4fd6d6';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#4fd6d6';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        const segs = 6;
        ctx.moveTo(sx, sy);
        for(let i=1;i<=segs;i++){
          const t = i/segs;
          const ix = sx + (px-sx)*t + (Math.random()-0.5)*7;
          const iy = sy + (py-sy)*t + (Math.random()-0.5)*7;
          ctx.lineTo(ix, iy);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Glow at tip
        ctx.fillStyle = '#4fd6d6';
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI*2);
        ctx.fill();
        break;
      }
      case 'cannonball': {
        ctx.fillStyle = '#222226';
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        break;
      }
      case 'iceshard': {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(screenAng);
        ctx.fillStyle = '#a8e0ff';
        ctx.beginPath();
        ctx.moveTo(5, 0); ctx.lineTo(-3, -3); ctx.lineTo(-3, 3);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#4fb0e0'; ctx.lineWidth = 0.8; ctx.stroke();
        ctx.restore();
        break;
      }
      case 'healorb': {
        const grd = ctx.createRadialGradient(px, py, 1, px, py, 6);
        grd.addColorStop(0, '#c0ffc0');
        grd.addColorStop(0.5, '#50ff80');
        grd.addColorStop(1, 'rgba(40,200,60,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI*2);
        ctx.fill();
        break;
      }
    }
  }
}

// ---------- AI ----------
function aiPlayCard(){
  const hand = state.hand.p2;
  const affordable = hand.filter(c => CARD_DB[c].cost <= state.elixir.p2);
  if(affordable.length===0) return;

  // Detect threats: enemy units near AI towers
  const threats = state.units.filter(u => {
    if(u.owner !== 'p1') return false;
    for(const k in state.towers){
      const t = state.towers[k];
      if(t.side === 'p2' && t.alive && Math.hypot(u.x-t.x, u.y-t.y) < 120) return true;
    }
    return false;
  });

  let pick, deployX, deployY;

  if(threats.length >= 3){
    // Big push incoming — use a spell on the cluster
    const spells = affordable.filter(c => CARD_DB[c].spell);
    if(spells.length > 0){
      pick = spells[0];
      deployX = threats.reduce((s,u)=>s+u.x,0)/threats.length;
      deployY = threats.reduce((s,u)=>s+u.y,0)/threats.length;
    }
  }

  if(!pick && threats.length > 0){
    // Defensive: play a cheap troop in the threatened lane
    const cheapTroops = affordable.filter(c => !CARD_DB[c].spell && CARD_DB[c].cost <= 3);
    if(cheapTroops.length > 0){
      pick = cheapTroops[Math.floor(Math.random()*cheapTroops.length)];
      const threat = threats[0];
      deployX = threat.x < W/2 ? (LANE_L.x1+LANE_L.x2)/2 : (LANE_R.x1+LANE_R.x2)/2;
      deployY = 55 + Math.random()*15;
    }
  }

  if(!pick){
    if(state.elixir.p2 >= 7){
      // Big push: play the most expensive card at the back
      pick = affordable.reduce((a,b) => CARD_DB[a].cost > CARD_DB[b].cost ? a : b);
      deployX = Math.random()<0.5 ? (LANE_L.x1+LANE_L.x2)/2 : (LANE_R.x1+LANE_R.x2)/2;
      deployY = CARD_DB[pick].hp >= 300 ? 45 + Math.random()*10 : 60 + Math.random()*20;
    } else {
      // Normal: random affordable card
      pick = affordable[Math.floor(Math.random()*affordable.length)];
      deployX = Math.random()<0.5 ? (LANE_L.x1+LANE_L.x2)/2 : (LANE_R.x1+LANE_R.x2)/2;
      deployY = CARD_DB[pick].hp >= 300 ? 50 + Math.random()*10 : 60 + Math.random()*20;
    }
  }

  state.elixir.p2 -= CARD_DB[pick].cost;
  // Use expanded deploy zone if player towers are destroyed
  if(deployY < 55 && (!state.towers.p1L.alive || !state.towers.p1R.alive)){
    // Deploy further forward in the lane where the tower is destroyed
    if(!state.towers.p1L.alive && deployX < W/2){
      deployY = 200 + Math.random()*20;
    } else if(!state.towers.p1R.alive && deployX >= W/2){
      deployY = 200 + Math.random()*20;
    }
  }
  spawnCard('p2', pick, deployX, deployY);
  const idx = hand.indexOf(pick);
  hand.splice(idx,1);
  state.deckQueue.p2.push(pick);
  hand.push(state.deckQueue.p2.shift());
}

// ---------- Main loop ----------
let lastTs = null;
function loop(ts){
  if(lastTs===null) lastTs = ts;
  let dt = (ts - lastTs)/1000;
  dt = Math.min(dt, 0.05);
  lastTs = ts;

  if(state){
    if(state.running && !state.over){
      update(dt);
    }
    draw();
  }
  requestAnimationFrame(loop);
}

function update(dt){
  state.time -= dt;
  if(state.time <= 0){
    state.time = 0;
    // decide winner by tower count
    const p1t = countAliveTowers('p1'), p2t = countAliveTowers('p2');
    if(p1t>p2t) endGame('p2'); // p2 destroyed more p1 towers -> p2... wait invert
    else if(p2t>p1t) endGame('p1');
    else endGame('tie');
    updateTimer();
    return;
  }
  updateTimer();

  // elixir regen 1 per 2.8s (approx double speed after minute mark like real game - keep simple)
  const regenRate = state.time < 60 ? (1/1.4) : (1/2.8);
  state.elixir.p1 = Math.min(10, state.elixir.p1 + regenRate*dt);
  state.elixir.p2 = Math.min(10, state.elixir.p2 + regenRate*dt);
  updateElixirBar();

  // AI logic (offline practice mode only)
  if(!ONLINE){
    state.aiTimer -= dt;
    if(state.aiTimer <= 0){
      state.aiTimer = 1.0 + Math.random()*1.5;
      if(Math.random() < 0.7) aiPlayCard();
    }
  }

  // update units
  for(const u of state.units) stepUnit(u, dt);
  state.units = state.units.filter(u=>u.hp>0);
  resolveUnitCollisions();

  // poison damage over time
  for(const u of state.units){
    if(u.poisonUntil && u.poisonUntil > state.time){
      u.hp -= u.poisonDps * dt;
    }
  }
  state.units = state.units.filter(u=>u.hp>0);

  // tower auto-attack (princess towers + active king towers attack units in range)
  for(const k in state.towers){
    const t = state.towers[k];
    if(!t.alive) continue;
    if(t.type==='princess' || t.active){
      if(t.frozenUntil && t.frozenUntil > state.time) continue; // frozen tower can't attack
      t.cooldown = (t.cooldown||0) - dt;
      const enemyOwner = t.side==='p1' ? 'p2' : 'p1';
      // Target nearest enemy unit, but prioritize units attacking this tower (within melee range)
      let best=null,bestD=Infinity;
      for(const u of state.units){
        if(u.owner!==enemyOwner) continue;
        if(u.deployTimer && u.deployTimer > 0) continue; // can't hit deploying units
        const d = Math.hypot(u.x-t.x,u.y-t.y);
        if(d < 110 && d<bestD){
          // Prioritize units that are very close to the tower (attacking it)
          const towerDist = d - t.r;
          if(towerDist < 25) bestD = d - 50; // boost priority for units in melee range
          else bestD = d;
          best=u;
        }
      }
      if(best && t.cooldown<=0){
        t.cooldown = 0.8;
        spawnTowerProjectile(t, best);
      }
    }
  }
  state.units = state.units.filter(u=>u.hp>0);

  // spawn death particles for dying units + death spawn (golemites, lava pups)
  for(const u of state.units){
    if(u.hp <= 0 && !u.deathCounted){
      u.deathCounted = true;
      // Death spawn (e.g. Golem -> Golemites, Lava Hound -> Lava Pups)
      if(u.def.deathSpawn){
        const spawnDef = CARD_DB[u.def.deathSpawn];
        const count = u.def.deathSpawnCount || 1;
        for(let i=0;i<count;i++){
          let ox = u.x + (i - (count-1)/2) * 14;
          ox = Math.max(20, Math.min(W-20, ox));
          state.units.push({
            id: state.nextId++,
            owner: u.owner, card: u.def.deathSpawn, def: spawnDef,
            x: ox, y: u.y,
            hp: spawnDef.hp, maxHp: spawnDef.hp,
            target: null, cooldown: 0,
            lane: laneOf(ox),
            slowUntil: 0, attackAnim: 0,
            facingX: u.owner==='p1' ? 0 : 0,
          });
        }
        // Spawn effect
        state.spellFx.push({x: u.x, y: u.y, r: 20, t: 0, dur: 0.4, color:'rgba(255,200,80,0.4)'});
      }
      // Death rage (Lumberjack drops rage on death)
      if(u.def.deathRage){
        for(const o of state.units){
          if(o.owner === u.owner && Math.hypot(o.x-u.x, o.y-u.y) < 55){
            o.rageUntil = state.time + 6;
          }
        }
        state.spellFx.push({x: u.x, y: u.y, r: 55, t: 0, dur: 0.5, color:'rgba(200,80,255,0.4)'});
      }
      // Death particles
      for(let i=0;i<6;i++){
        const ang = (i/6)*Math.PI*2;
        state.deathFx.push({
          x: u.x, y: u.y,
          vx: Math.cos(ang)*35, vy: Math.sin(ang)*35,
          t: 0, dur: 0.5,
          col: u.owner==='p1' ? '90,168,236' : '236,106,90'
        });
      }
    }
  }
  // update death particles
  for(const fx of state.deathFx){
    fx.t += dt;
    fx.x += fx.vx * dt;
    fx.y += fx.vy * dt;
  }
  state.deathFx = state.deathFx.filter(fx => fx.t < fx.dur);
  state.units = state.units.filter(u=>u.hp>0);

  // update projectiles
  updateProjectiles(dt);
  state.units = state.units.filter(u=>u.hp>0);

  // spell fx decay
  for(const fx of state.spellFx) fx.t += dt;
  state.spellFx = state.spellFx.filter(fx=>fx.t<fx.dur);

  checkGameOver();
}

// ---------- Rendering ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  // background lanes
  ctx.fillStyle = '#1c3322';
  ctx.fillRect(0,0,W,H);

  // side grass strips
  ctx.fillStyle = '#213b28';
  ctx.fillRect(0,0,15,H);
  ctx.fillRect(W-15,0,15,H);
  ctx.fillRect(140,0,80,H); // middle strip between lanes

  // lanes
  ctx.fillStyle = '#2c4f36';
  ctx.fillRect(LANE_L.x1,0,LANE_L.x2-LANE_L.x1,H);
  ctx.fillRect(LANE_R.x1,0,LANE_R.x2-LANE_R.x1,H);

  // river
  ctx.fillStyle = 'rgba(60,140,190,0.55)';
  ctx.fillRect(0,RIVER_Y1,W,RIVER_Y2-RIVER_Y1);
  // bridges
  ctx.fillStyle = '#7a5a36';
  ctx.fillRect(LANE_L.x1,RIVER_Y1-4,LANE_L.x2-LANE_L.x1,RIVER_Y2-RIVER_Y1+8);
  ctx.fillRect(LANE_R.x1,RIVER_Y1-4,LANE_R.x2-LANE_R.x1,RIVER_Y2-RIVER_Y1+8);

  // deploy zone highlight when a card selected
  if(state.selectedCard){
    ctx.fillStyle = 'rgba(232,184,75,0.12)';
    // own half
    ctx.fillRect(15, RIVER_Y2+4, W-30, 500-(RIVER_Y2+4));
    // expanded zone: left lane if enemy left princess tower destroyed
    if(!state.towers.p2L.alive){
      ctx.fillRect(15, RIVER_Y1-4, W/2-15, 260-(RIVER_Y1-4));
    }
    // expanded zone: right lane if enemy right princess tower destroyed
    if(!state.towers.p2R.alive){
      ctx.fillRect(W/2, RIVER_Y1-4, W/2-15, 260-(RIVER_Y1-4));
    }
  }

  // double elixir indicator
  if(state.time < 60 && state.time > 0){
    const pulse = 0.5 + 0.3*Math.sin(performance.now()/200);
    ctx.fillStyle = `rgba(232,110,60,${pulse*0.8})`;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('2x ELIXIR!', W/2, RIVER_Y1 - 6);
    ctx.textAlign = 'left';
  }

  // towers
  for(const k in state.towers){
    drawTower(state.towers[k]);
  }

  // units
  for(const u of state.units) drawUnit(u);

  // projectiles
  drawProjectiles();

  // death particles
  for(const fx of state.deathFx){
    const p = fx.t/fx.dur;
    ctx.fillStyle = `rgba(${fx.col},${1-p})`;
    ctx.beginPath();
    ctx.arc(fx.x, vy(fx.y), 3*(1-p*0.5), 0, Math.PI*2);
    ctx.fill();
  }

  // spell fx
  for(const fx of state.spellFx){
    const p = fx.t/fx.dur;
    ctx.beginPath();
    ctx.arc(fx.x, vy(fx.y), fx.r*(0.6+0.4*p), 0, Math.PI*2);
    if(fx.color){
      ctx.fillStyle = fx.color;
    } else {
      ctx.fillStyle = `rgba(255,120,40,${0.5*(1-p)})`;
    }
    ctx.fill();
  }

  if(state.over || state.time<=0){
    // handled by overlay
  }
}

function drawTower(t){
  const ty = vy(t.y);
  if(!t.alive){
    ctx.beginPath();
    ctx.arc(t.x,ty,t.r*0.7,0,Math.PI*2);
    ctx.fillStyle = 'rgba(60,50,40,0.6)';
    ctx.fill();
    return;
  }
  const isKing = t.type==='king';
  ctx.beginPath();
  ctx.arc(t.x,ty,t.r,0,Math.PI*2);
  const col = t.side==='p1' ? '#4a8fd6' : '#d65a4a';
  ctx.fillStyle = isKing ? shade(col,-15) : col;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.stroke();
  if(isKing){
    ctx.fillStyle='#f2e6c8';
    ctx.font='bold 16px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('♔', t.x, ty+1);
  }
  // hp bar
  drawHpBar(t.x, ty - t.r - 8, t.r*2, t.hp, t.maxHp, t.side==='p1'?'#4a8fd6':'#d65a4a');
  // Frozen overlay
  if(t.frozenUntil && t.frozenUntil > state.time){
    ctx.fillStyle = 'rgba(120,200,255,0.3)';
    ctx.beginPath(); ctx.arc(t.x, ty, t.r+4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(180,230,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawUnit(u){
  const col = u.owner==='p1' ? '#5aa8ec' : '#ec6a5a';
  const uy = vy(u.y);
  const bob = Math.sin((u.x+u.y)*0.15 + performance.now()/220) * 1.2;
  // attack lunge: a quick punch toward whatever the unit is currently attacking
  const ANIM_DUR = 0.22, LUNGE = 5;
  const atkT = u.atkAnimT===undefined ? 999 : u.atkAnimT;
  const pulse = atkT < ANIM_DUR ? Math.sin((atkT/ANIM_DUR)*Math.PI) : 0;
  const fx = u.facingX||0, fy = u.facingY||0;
  const screenFY = MY_ROLE==='p2' ? -fy : fy; // canonical -> screen direction
  const lungeX = fx*pulse*LUNGE, lungeY = screenFY*pulse*LUNGE;
  const scale = 1 + pulse*0.14;
  drawModel(ctx, u.def.model, u.x+lungeX, uy+bob+lungeY, scale, col, u.owner);
  // Frozen overlay
  if(u.frozenUntil && u.frozenUntil > state.time){
    ctx.fillStyle = 'rgba(120,200,255,0.3)';
    ctx.beginPath(); ctx.arc(u.x, uy, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(180,230,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // Rage aura
  if(u.rageUntil && u.rageUntil > state.time){
    ctx.strokeStyle = 'rgba(220,80,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(u.x, uy, 12, 0, Math.PI*2); ctx.stroke();
  }
  // Poisoned overlay
  if(u.poisonUntil && u.poisonUntil > state.time){
    ctx.fillStyle = 'rgba(80,200,60,0.2)';
    ctx.beginPath(); ctx.arc(u.x, uy, 9, 0, Math.PI*2); ctx.fill();
  }
  // Deploy timer: countdown ring while unit is deploying
  if(u.deployTimer && u.deployTimer > 0){
    const pct = u.deployTimer / 1.0;
    ctx.strokeStyle = u.owner==='p1' ? 'rgba(90,168,236,0.8)' : 'rgba(236,106,90,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(u.x, uy, 14, -Math.PI/2, -Math.PI/2 + pct*Math.PI*2);
    ctx.stroke();
  }
  drawHpBar(u.x, uy-20, 22, u.hp, u.maxHp, col);
}

// ---------- Vector "models" (canvas-drawn, no emoji/text glyphs) ----------
function drawModelOn(targetCtx, type, x, y, scale, col, owner){
  drawModel(targetCtx, type, x, y, scale, col, owner);
}
function drawModel(c, type, x, y, scale, col, owner){
  c.save();
  c.translate(x, y);
  c.scale(scale, scale);
  const facing = owner==='p1' ? -1 : 1; // p1 faces up-board, p2 faces down
  const dark = shade(col, -60);
  const light = shade(col, 40);
  const skin = '#e8c39a';
  const steel = '#c9d2da';
  const steelDark = '#8a94a0';

  // soft ground shadow
  c.beginPath();
  c.ellipse(0, 11, 9, 3, 0, 0, Math.PI*2);
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.fill();

  switch(type){
    case 'knight': {
      // legs
      c.fillStyle = dark;
      c.fillRect(-4,2,3,8);
      c.fillRect(1,2,3,8);
      // body/armor
      c.beginPath();
      c.moveTo(-6,2); c.lineTo(6,2); c.lineTo(5,-8); c.lineTo(-5,-8); c.closePath();
      c.fillStyle = col;
      c.fill();
      c.strokeStyle = dark; c.lineWidth=1; c.stroke();
      // shield
      c.beginPath();
      c.ellipse(facing*6, -1, 3, 5, 0, 0, Math.PI*2);
      c.fillStyle = steel; c.fill(); c.strokeStyle=steelDark; c.stroke();
      // sword
      c.strokeStyle = steel; c.lineWidth=2;
      c.beginPath(); c.moveTo(-facing*6,-9); c.lineTo(-facing*6,-16); c.stroke();
      c.fillStyle = '#d9b64a'; c.fillRect(-facing*6-2,-9,4,2);
      // helmet
      c.beginPath(); c.arc(0,-11,5,0,Math.PI*2); c.fillStyle=steel; c.fill(); c.strokeStyle=steelDark; c.stroke();
      c.fillStyle = dark; c.fillRect(-2,-13,4,2); // visor slit
      // plume
      c.fillStyle = '#d65a4a';
      c.beginPath(); c.moveTo(0,-16); c.lineTo(3,-21); c.lineTo(-1,-18); c.closePath(); c.fill();
      break;
    }
    case 'archer': {
      c.fillStyle = dark; c.fillRect(-3,2,2.5,8); c.fillRect(0.5,2,2.5,8);
      c.beginPath();
      c.moveTo(-5,2); c.lineTo(5,2); c.lineTo(4,-7); c.lineTo(-4,-7); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.stroke();
      // cloak
      c.fillStyle = shade(col,-25);
      c.beginPath(); c.moveTo(-5,-6); c.lineTo(-8,4); c.lineTo(-3,2); c.closePath(); c.fill();
      // bow
      c.strokeStyle = '#8a5a2e'; c.lineWidth=1.5;
      c.beginPath(); c.arc(facing*6,-3,7,-Math.PI/2.3,Math.PI/2.3); c.stroke();
      c.strokeStyle='#e8e0c8'; c.lineWidth=0.6;
      c.beginPath(); c.moveTo(facing*6,-9.5); c.lineTo(facing*6,3.5); c.stroke();
      // head + hood
      c.beginPath(); c.arc(0,-10,4.5,0,Math.PI*2); c.fillStyle=skin; c.fill();
      c.beginPath(); c.arc(0,-11,5,Math.PI,0); c.fillStyle=shade(col,-25); c.fill();
      break;
    }
    case 'giant': {
      c.fillStyle = dark; c.fillRect(-6,4,5,9); c.fillRect(2,4,5,9);
      c.beginPath();
      c.moveTo(-10,4); c.lineTo(10,4); c.lineTo(8,-12); c.lineTo(-8,-12); c.closePath();
      c.fillStyle = col; c.fill(); c.strokeStyle=dark; c.lineWidth=1.5; c.stroke();

function drawHpBar(cx, y, width, hp, maxHp, col){
  const w = Math.max(width,16);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(cx-w/2, y-3, w, 5);
  ctx.fillStyle = col;
  ctx.fillRect(cx-w/2, y-3, w*Math.max(0,hp/maxHp), 5);
}

function shade(hex, pct){
  const num = parseInt(hex.slice(1),16);
  let r=(num>>16)+pct, g=((num>>8)&0xff)+pct, b=(num&0xff)+pct;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

// ---------- UI: hand & input ----------
function renderHand(){
  const handEl = document.getElementById('hand');
  handEl.innerHTML = '';
  state.hand[MY_ROLE].forEach((cardKey, idx)=>{
    const def = CARD_DB[cardKey];
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.idx = idx;
    div.dataset.rarity = def.rarity || 'common';
    div.innerHTML = `<div class="cost">${def.cost}</div><canvas class="icon" width="88" height="88"></canvas><div class="name">${def.name}</div>`;
    div.addEventListener('click', ()=> selectCard(idx));
    handEl.appendChild(div);
    const mini = div.querySelector('canvas');
    const mctx = mini.getContext('2d');
    drawModelOn(mctx, def.model, 44, 60, 2.2, '#7fb8ef', 'p1');
  });
  refreshCardStates();
}

function refreshCardStates(){
  const cards = document.querySelectorAll('.card');
  cards.forEach(c=>{
    const idx = +c.dataset.idx;
    const key = state.hand[MY_ROLE][idx];
    const def = CARD_DB[key];
    c.classList.toggle('disabled', def.cost > state.elixir[MY_ROLE] + 1e-6);
    c.classList.toggle('selected', state.selectedCard === idx);
  });
}

function selectCard(idx){
  if(state.over) return;
  const key = state.hand[MY_ROLE][idx];
  const def = CARD_DB[key];
  if(def.cost > state.elixir[MY_ROLE]) return;
  state.selectedCard = (state.selectedCard === idx) ? null : idx;
  refreshCardStates();
}

function boardCoordsFromEvent(evt){
  const rect = canvas.getBoundingClientRect();
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  const x = (clientX - rect.left) / rect.width * W;
  const yScreen = (clientY - rect.top) / rect.height * H;
  return {x, y: invVy(yScreen)}; // convert to canonical coords
}

function handleBoardTap(evt){
  if(state.selectedCard===null || state.over) return;
  const {x,y} = boardCoordsFromEvent(evt);
  const key = state.hand[MY_ROLE][state.selectedCard];
  const def = CARD_DB[key];
  if(!def.spell && !inDeployZone(MY_ROLE, x, y)) return;
  if(def.cost > state.elixir[MY_ROLE]) return;

  const px = Math.max(20,Math.min(W-20,x));
  state.elixir[MY_ROLE] -= def.cost;
  spawnCard(MY_ROLE, key, px, y);
  if(ONLINE) sendPlay(MY_ROLE, key, px, y);

  // Cycle: put played card at back of queue, draw next from front
  const idx = state.selectedCard;
  state.hand[MY_ROLE].splice(idx,1);
  state.deckQueue[MY_ROLE].push(key);
  state.hand[MY_ROLE].push(state.deckQueue[MY_ROLE].shift());
  state.selectedCard = null;
  renderHand();
  updateElixirBar();
}

canvas.addEventListener('click', handleBoardTap);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleBoardTap(e); }, {passive:false});

// ---------- HUD updates ----------
function updateElixirBar(){
  const pct = (state.elixir[MY_ROLE]/10)*100;
  document.getElementById('elixirFill').style.width = pct+'%';
  document.getElementById('elixirLabel').textContent = state.elixir[MY_ROLE].toFixed(1)+' / 10';
  refreshCardStates();
}
function updateTimer(){
  const t = Math.max(0,Math.ceil(state.time));
  const m = Math.floor(t/60), s = t%60;
  document.getElementById('timer').textContent = m+':'+String(s).padStart(2,'0');
  document.getElementById('status').textContent = state.time>0 ? 'Deploy troops · defend your towers' : 'Battle over';
}

document.getElementById('playAgain').addEventListener('click', ()=>{
  if(ONLINE){
    // simplest restart for online: reload the page back into the lobby
    location.reload();
  } else {
    newGame();
  }
});

document.getElementById('btnAI').addEventListener('click', ()=>{
  ONLINE = false;
  MY_ROLE = 'p1';
  document.getElementById('lobby').style.display = 'none';
  newGame();
});

document.getElementById('btnHost').addEventListener('click', ()=>{
  const code = randomRoomCode();
  MY_ROLE = 'p1';
  connectToRoom(code, true);
});

document.getElementById('btnJoin').addEventListener('click', ()=>{
  document.getElementById('lobbyMode').style.display = 'none';
  document.getElementById('lobbyJoinForm').style.display = 'flex';
});

document.getElementById('btnJoinGo').addEventListener('click', ()=>{
  const code = document.getElementById('joinCodeInput').value.trim();
  if(!code) return;
  connectToRoom(code, false);
});

// keep elixir bar / hand synced periodically for AI-caused changes not otherwise triggering UI
setInterval(()=>{ if(state) updateElixirBar(); }, 250);

updateTrophyDisplays();
updateCoinDisplays();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
